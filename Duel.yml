          package ru.eclips.duel;

          import cn.nukkit.utils.Config;
          import cn.nukkit.utils.ConfigSection;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;

          /** Хранилище карт (maps.yml). Ключи карт имеют префикс m_, чтобы YAML не путал имена с числами и булевыми. */
          public final class MapStore {
              private final File file;
              private Config cfg;
              private final Map<String, DuelMap> maps = new LinkedHashMap<>();

              public MapStore(File file) {
                  this.file = file;
                  load();
              }

              public void load() {
                  cfg = new Config(file, Config.YAML);
                  maps.clear();
                  try {
                      ConfigSection sec = cfg.getSection("maps");
                      for (String key : sec.getKeys(false)) {
                          if (!key.startsWith("m_")) {
                              continue;
                          }
                          String name = key.substring(2);
                          String b = "maps." + key;
                          DuelMap m = new DuelMap(name);
                          m.enabled = cfg.getBoolean(b + ".enabled", true);
                          m.lobby = DuelMap.Pt.parse(cfg.getString(b + ".lobby", ""));
                          m.red = DuelMap.Pt.parse(cfg.getString(b + ".red", ""));
                          m.blue = DuelMap.Pt.parse(cfg.getString(b + ".blue", ""));
                          ConfigSection ks = cfg.getSection(b + ".kit");
                          for (String k : ks.getKeys(false)) {
                              String v = ks.getString(k, "");
                              if (v != null && !v.isEmpty()) {
                                  m.kit.put(k, v);
                              }
                          }
                          maps.put(name.toLowerCase(), m);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              public DuelMap get(String name) {
                  return name == null ? null : maps.get(name.toLowerCase());
              }

              public List<DuelMap> all() {
                  return new ArrayList<>(maps.values());
              }

              public void add(DuelMap m) {
                  maps.put(m.name.toLowerCase(), m);
                  save(m);
              }

              public void save(DuelMap m) {
                  try {
                      String b = "maps.m_" + m.name;
                      cfg.set(b + ".name", m.name);
                      cfg.set(b + ".enabled", m.enabled);
                      cfg.set(b + ".lobby", m.lobby == null ? "" : m.lobby.serialize());
                      cfg.set(b + ".red", m.red == null ? "" : m.red.serialize());
                      cfg.set(b + ".blue", m.blue == null ? "" : m.blue.serialize());
                      cfg.set(b + ".kit", new LinkedHashMap<String, Object>(m.kit));
                      cfg.save();
                  } catch (Throwable ignored) {
                  }
              }

              public void remove(String name) {
                  DuelMap m = maps.remove(name.toLowerCase());
                  if (m == null) {
                      return;
                  }
                  try {
                      cfg.getSection("maps").remove("m_" + m.name);
                      cfg.save();
                  } catch (Throwable ignored) {
                  }
              }
          }
