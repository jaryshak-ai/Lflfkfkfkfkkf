          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.io.OutputStreamWriter;
          import java.io.Writer;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.AtomicMoveNotSupportedException;
          import java.nio.file.Files;
          import java.nio.file.StandardCopyOption;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Properties;
          import java.util.UUID;

          /**
           * Полный снимок игрока до дуэли. Пишется на диск ДО очистки инвентаря,
           * поэтому переживает рестарт и краш сервера.
           */
          public final class PlayerState {
              public final Map<Integer, String> items = new LinkedHashMap<>();
              public final String[] armor = {"", "", "", ""};
              public String offhand = "";
              public int exp;
              public int level;
              public int food = 20;
              public int gamemode;
              public float health = 20f;
              public float saturation = 5f;
              public boolean allowFlight;
              public final List<int[]> effects = new ArrayList<>();
              public String levelName = "";
              public double x;
              public double y;
              public double z;
              public double yaw;
              public double pitch;
              public String nameTag = "";
              /** false, если какой-то предмет не удалось закодировать (тогда в дуэль не пускаем). */
              public boolean safe = true;

              private String enc(Item it) {
                  if (ItemCodec.isEmpty(it)) {
                      return "";
                  }
                  String s = ItemCodec.encode(it);
                  if (s.isEmpty()) {
                      safe = false;
                  }
                  return s;
              }

              public static PlayerState capture(Player p) {
                  PlayerState s = new PlayerState();
                  try {
                      PlayerInventory inv = p.getInventory();
                      int size = inv.getSize();
                      for (int i = 0; i < size; i++) {
                          String e = s.enc(inv.getItem(i));
                          if (!e.isEmpty()) {
                              s.items.put(i, e);
                          }
                      }
                      s.armor[0] = s.enc(inv.getHelmet());
                      s.armor[1] = s.enc(inv.getChestplate());
                      s.armor[2] = s.enc(inv.getLeggings());
                      s.armor[3] = s.enc(inv.getBoots());
                      s.offhand = s.enc(Util.getOffhand(p));
                  } catch (Throwable t) {
                      s.safe = false;
                  }
                  s.exp = Util.num(Refl.call(p, "getExperience"));
                  s.level = Util.num(Refl.call(p, "getExperienceLevel"));
                  try {
                      s.health = p.getHealth();
                  } catch (Throwable ignored) {
                  }
                  Object fd = Refl.call(p, "getFoodData");
                  Object lv = Refl.call(fd, "getLevel");
                  if (lv instanceof Number) {
                      s.food = ((Number) lv).intValue();
                  }
                  Object sat = Refl.call(fd, "getFoodSaturationLevel");
                  if (sat instanceof Number) {
                      s.saturation = ((Number) sat).floatValue();
                  }
                  try {
                      s.gamemode = p.getGamemode();
                  } catch (Throwable ignored) {
                  }
                  s.allowFlight = Util.getAllowFlight(p);
                  Object em = Refl.call(p, "getEffects");
                  if (em instanceof Map) {
                      for (Object ef : ((Map<?, ?>) em).values()) {
                          int dur = Util.num(Refl.call(ef, "getDuration"));
                          if (dur > 0) {
                              s.effects.add(new int[]{Util.num(Refl.call(ef, "getId")), Util.num(Refl.call(ef, "getAmplifier")), dur});
                          }
                      }
                  }
                  try {
                      Location l = p.getLocation();
                      s.levelName = p.getLevel().getFolderName();
                      s.x = l.getX();
                      s.y = l.getY();
                      s.z = l.getZ();
                      s.yaw = l.getYaw();
                      s.pitch = l.getPitch();
                  } catch (Throwable ignored) {
                  }
                  try {
                      String nt = p.getNameTag();
                      s.nameTag = nt == null ? "" : nt;
                  } catch (Throwable ignored) {
                  }
                  return s;
              }

              /** Возвращает true, если вещи и позиция восстановлены полностью. */
              public boolean restore(DuelPlugin plugin, Player p) {
                  boolean ok = true;
                  try {
                      PlayerInventory inv = p.getInventory();
                      inv.clearAll();
                      Util.setOffhand(p, null);
                      for (Map.Entry<Integer, String> e : items.entrySet()) {
                          Item it = ItemCodec.decode(e.getValue());
                          if (it == null) {
                              ok = false;
                              continue;
                          }
                          inv.setItem(e.getKey(), it);
                      }
                      Item h = ItemCodec.decode(armor[0]);
                      Item c = ItemCodec.decode(armor[1]);
                      Item l = ItemCodec.decode(armor[2]);
                      Item b = ItemCodec.decode(armor[3]);
                      inv.setHelmet(h == null ? ItemCodec.air() : h);
                      inv.setChestplate(c == null ? ItemCodec.air() : c);
                      inv.setLeggings(l == null ? ItemCodec.air() : l);
                      inv.setBoots(b == null ? ItemCodec.air() : b);
                      Item off = ItemCodec.decode(offhand);
                      if (off != null) {
                          Util.setOffhand(p, off);
                      }
                      try {
                          inv.sendContents(p);
                          inv.sendArmorContents(p);
                      } catch (Throwable ignored) {
                      }
                  } catch (Throwable t) {
                      ok = false;
                  }
                  Refl.run(p, "setExperience", exp, level);
                  Util.clearEffects(p);
                  for (int[] e : effects) {
                      Object eff = Refl.callStatic("cn.nukkit.potion.Effect", "getEffect", e[0]);
                      if (eff != null) {
                          Refl.run(eff, "setAmplifier", e[1]);
                          Refl.run(eff, "setDuration", e[2]);
                          Refl.run(p, "addEffect", eff);
                      }
                  }
                  try {
                      if (p.getGamemode() != gamemode) {
                          p.setGamemode(gamemode);
                      }
                  } catch (Throwable ignored) {
                  }
                  Util.setFlight(p, allowFlight, false);
                  try {
                      float max = p.getMaxHealth();
                      p.setHealth(health <= 0 ? max : Math.min(health, max));
                  } catch (Throwable ignored) {
                  }
                  Util.setFood(p, food, saturation);
                  try {
                      if (!nameTag.isEmpty()) {
                          p.setNameTag(nameTag);
                      }
                  } catch (Throwable ignored) {
                  }
                  try {
                      Level lv = plugin.getLevel(levelName);
                      Location target;
                      if (lv != null) {
                          target = new Location(x, y, z, yaw, pitch, lv);
                      } else {
                          Level def = plugin.getServer().getDefaultLevel();
                          Position sp = def.getSafeSpawn();
                          target = new Location(sp.getX(), sp.getY(), sp.getZ(), 0, 0, def);
                      }
                      plugin.teleport(p, target);
                  } catch (Throwable t) {
                      ok = false;
                  }
                  return ok;
              }

              // ---------------- диск ----------------

              public static File file(File dir, UUID id) {
                  return new File(dir, id + ".dat");
              }

              public static void delete(File dir, UUID id) {
                  try {
                      File f = file(dir, id);
                      if (f.exists()) {
                          f.delete();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              public void write(File dir, UUID id) throws IOException {
                  if (!dir.exists()) {
                      dir.mkdirs();
                  }
                  Properties pr = new Properties();
                  pr.setProperty("ver", "1");
                  for (Map.Entry<Integer, String> e : items.entrySet()) {
                      pr.setProperty("i." + e.getKey(), e.getValue());
                  }
                  for (int i = 0; i < 4; i++) {
                      pr.setProperty("a." + i, armor[i]);
                  }
                  pr.setProperty("off", offhand);
                  pr.setProperty("exp", String.valueOf(exp));
                  pr.setProperty("lvl", String.valueOf(level));
                  pr.setProperty("hp", String.valueOf(health));
                  pr.setProperty("food", String.valueOf(food));
                  pr.setProperty("sat", String.valueOf(saturation));
                  pr.setProperty("gm", String.valueOf(gamemode));
                  pr.setProperty("fly", String.valueOf(allowFlight));
                  for (int i = 0; i < effects.size(); i++) {
                      int[] e = effects.get(i);
                      pr.setProperty("e." + i, e[0] + "," + e[1] + "," + e[2]);
                  }
                  pr.setProperty("world", levelName);
                  pr.setProperty("x", String.valueOf(x));
                  pr.setProperty("y", String.valueOf(y));
                  pr.setProperty("z", String.valueOf(z));
                  pr.setProperty("yaw", String.valueOf(yaw));
                  pr.setProperty("pitch", String.valueOf(pitch));
                  pr.setProperty("tag", nameTag);

                  File tmp = new File(dir, id + ".tmp");
                  File dst = file(dir, id);
                  try (FileOutputStream fos = new FileOutputStream(tmp);
                       Writer w = new OutputStreamWriter(fos, StandardCharsets.UTF_8)) {
                      pr.store(w, "duel saved state");
                      w.flush();
                      fos.getFD().sync();
                  }
                  try {
                      Files.move(tmp.toPath(), dst.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE);
                  } catch (AtomicMoveNotSupportedException ex) {
                      Files.move(tmp.toPath(), dst.toPath(), StandardCopyOption.REPLACE_EXISTING);
                  }
              }

              public static PlayerState read(File f) {
                  try (FileInputStream in = new FileInputStream(f);
                       InputStreamReader r = new InputStreamReader(in, StandardCharsets.UTF_8)) {
                      Properties pr = new Properties();
                      pr.load(r);
                      PlayerState s = new PlayerState();
                      for (String k : pr.stringPropertyNames()) {
                          if (k.startsWith("i.")) {
                              s.items.put(Integer.parseInt(k.substring(2)), pr.getProperty(k));
                          }
                      }
                      for (int i = 0; i < 4; i++) {
                          s.armor[i] = pr.getProperty("a." + i, "");
                      }
                      s.offhand = pr.getProperty("off", "");
                      s.exp = Integer.parseInt(pr.getProperty("exp", "0"));
                      s.level = Integer.parseInt(pr.getProperty("lvl", "0"));
                      s.health = Float.parseFloat(pr.getProperty("hp", "20"));
                      s.food = Integer.parseInt(pr.getProperty("food", "20"));
                      s.saturation = Float.parseFloat(pr.getProperty("sat", "5"));
                      s.gamemode = Integer.parseInt(pr.getProperty("gm", "0"));
                      s.allowFlight = Boolean.parseBoolean(pr.getProperty("fly", "false"));
                      for (int i = 0; i < 200; i++) {
                          String e = pr.getProperty("e." + i);
                          if (e == null) {
                              break;
                          }
                          String[] p = e.split(",");
                          s.effects.add(new int[]{Integer.parseInt(p[0]), Integer.parseInt(p[1]), Integer.parseInt(p[2])});
                      }
                      s.levelName = pr.getProperty("world", "");
                      s.x = Double.parseDouble(pr.getProperty("x", "0"));
                      s.y = Double.parseDouble(pr.getProperty("y", "64"));
                      s.z = Double.parseDouble(pr.getProperty("z", "0"));
                      s.yaw = Double.parseDouble(pr.getProperty("yaw", "0"));
                      s.pitch = Double.parseDouble(pr.getProperty("pitch", "0"));
                      s.nameTag = pr.getProperty("tag", "");
                      return s;
                  } catch (Throwable t) {
                      return null;
                  }
              }
          }
