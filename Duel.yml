              public void openTeam(Player p, Match mt) {
                  Match.Member mb = mt.member(p.getUniqueId());
                  if (mb == null || mt.state != Match.State.WAITING) {
                      return;
                  }
                  if (mb.team != null) {
                      p.sendMessage(Msg.err("Команда уже выбрана, менять её нельзя."));
