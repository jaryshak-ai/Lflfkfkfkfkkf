          package ru.eclips.duel;

          import cn.nukkit.Player;
          import cn.nukkit.block.Block;
          import cn.nukkit.item.Item;
          import cn.nukkit.scheduler.Task;

          /** Мелкие помощники. Рискованные вызовы API идут через рефлексию (Refl). */
          public final class Util {
              private static final String ADV_TYPE = "cn.nukkit.AdventureSettings$Type";

              private Util() {
              }

              public static Item item(String name, int legacyId) {
                  try {
                      Item it = Item.fromString("minecraft:" + name);
                      if (it != null && !it.isNull()) {
                          return it;
                      }
                  } catch (Throwable ignored) {
                  }
                  try {
                      return Item.get(legacyId);
                  } catch (Throwable ignored) {
                  }
                  return ItemCodec.air();
              }

              public static boolean isCompass(Item it) {
                  try {
                      return it != null && !it.isNull() && it.hasCustomName() && Msg.COMPASS_NAME.equals(it.getCustomName());
                  } catch (Throwable t) {
                      return false;
                  }
              }

              public static Item getOffhand(Player p) {
                  Object inv = Refl.call(p, "getOffhandInventory");
                  if (inv == null) {
                      return null;
                  }
                  Object it = Refl.call(inv, "getItem", 0);
                  return it instanceof Item ? (Item) it : null;
              }

              public static void setOffhand(Player p, Item item) {
                  Object inv = Refl.call(p, "getOffhandInventory");
                  if (inv == null) {
                      return;
                  }
                  Item it = item == null ? ItemCodec.air() : item;
                  Refl.run(inv, "setItem", 0, it);
              }

              public static int meta(Block b) {
                  Object o = Refl.call(b, "getDamage");
                  return o instanceof Number ? ((Number) o).intValue() : 0;
              }

              public static Block block(int id, int meta) {
                  Object o = Refl.callStatic("cn.nukkit.block.Block", "get", id, meta);
                  return o instanceof Block ? (Block) o : null;
              }

              public static int num(Object o) {
                  return o instanceof Number ? ((Number) o).intValue() : 0;
              }

              public static void setImmobile(Player p, boolean v) {
                  Refl.run(p, "setImmobile", v);
              }

              public static void setFood(Player p, int level, float sat) {
                  Object fd = Refl.call(p, "getFoodData");
                  if (!Refl.run(fd, "setLevel", level, sat)) {
                      Refl.run(fd, "setLevel", level);
                  }
              }

              public static void heal(Player p) {
                  try {
                      p.setHealth(p.getMaxHealth());
                  } catch (Throwable ignored) {
                  }
                  setFood(p, 20, 20f);
                  Refl.run(p, "extinguish");
              }

              public static void clearEffects(Player p) {
                  Refl.run(p, "removeAllEffects");
              }

              public static boolean getAllowFlight(Player p) {
                  Object as = Refl.call(p, "getAdventureSettings");
                  Object type = Refl.enumValue(ADV_TYPE, "ALLOW_FLIGHT");
                  if (as == null || type == null) {
                      return false;
                  }
                  return Boolean.TRUE.equals(Refl.call(as, "get", type));
              }

              public static void setFlight(Player p, boolean allow, boolean flying) {
                  Object as = Refl.call(p, "getAdventureSettings");
                  if (as == null) {
                      return;
                  }
                  Object ta = Refl.enumValue(ADV_TYPE, "ALLOW_FLIGHT");
                  Object tf = Refl.enumValue(ADV_TYPE, "FLYING");
                  if (ta != null) {
                      Refl.run(as, "set", ta, allow);
                  }
                  if (tf != null) {
                      Refl.run(as, "set", tf, flying);
                  }
                  Refl.run(as, "update");
              }

              public static void title(Player p, String main, String sub, int in, int stay, int out) {
                  if (!Refl.run(p, "sendTitle", main, sub, in, stay, out)) {
                      Refl.run(p, "sendTitle", main, sub);
                  }
              }

              public static void tip(Player p, String s) {
                  Refl.run(p, "sendTip", s);
              }

              /** Задача планировщика, которая вызывает Runnable и не даёт ошибке уронить сервер. */
              public static final class RunTask extends Task {
                  private final DuelPlugin plugin;
                  private final Runnable r;

                  public RunTask(DuelPlugin plugin, Runnable r) {
                      this.plugin = plugin;
                      this.r = r;
                  }

                  @Override
                  public void onRun(int currentTick) {
                      try {
                          r.run();
                      } catch (Throwable t) {
                          plugin.getLogger().warning("Duel task error: " + t);
                      }
                  }
              }
          }
          EOF_DUEL_16

      - name: Build plugin jar
        run: |
          ok=0
          for v in "com.nukkit-mot nukkit-mot 1.26.50-R1" "com.nukkit-mot nukkit-mot 1.26.40-R1" "cn.nukkit Nukkit MOT-SNAPSHOT"; do
            set -- $v
            echo "Trying $1:$2:$3"
            if mvn -B -ntp -Dnukkit.group="$1" -Dnukkit.artifact="$2" -Dnukkit.version="$3" clean package; then
              ok=1
              break
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "Build failed for all Nukkit-MOT versions"
            exit 1
          fi
          ls -la target/*.jar

      - name: Upload Duel.jar
        uses: actions/upload-artifact@v4
        with:
          name: Duel
          path: target/Duel.jar
          if-no-files-found: error
