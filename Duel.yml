name: Build Duel plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project files
        run: |
          set -e
          mkdir -p src/main/java/ru/eclips/duel src/main/resources
          cat > pom.xml <<'EOF_DUEL_00'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <groupId>ru.eclips</groupId>
              <artifactId>duel</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>

              <properties>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
                  <nukkit.group>com.nukkit-mot</nukkit.group>
                  <nukkit.artifact>nukkit-mot</nukkit.artifact>
                  <nukkit.version>1.26.50-R1</nukkit.version>
              </properties>

              <repositories>
                  <repository>
                      <id>repo-lanink-cn</id>
                      <url>https://repo.lanink.cn/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>${nukkit.group}</groupId>
                      <artifactId>${nukkit.artifact}</artifactId>
                      <version>${nukkit.version}</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <finalName>Duel</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <release>17</release>
                              <encoding>UTF-8</encoding>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF_DUEL_00
          cat > src/main/resources/plugin.yml <<'EOF_DUEL_01'
          name: Duel
          main: ru.eclips.duel.DuelPlugin
          version: "1.0.0"
          api: ["1.0.0"]
          author: Eclips
          description: Дуэли команда на команду от 1x1 до 5x5 с картами, сетами и статистикой
          commands:
            duel:
              description: Меню дуэлей
              usage: /duel
              permission: duel.use
            aduel:
              description: Админ-меню дуэлей
              usage: /aduel
              permission: duel.admin
          permissions:
            duel.use:
              description: Пользоваться дуэлями
              default: true
            duel.admin:
              description: Управление картами дуэлей
              default: op
          EOF_DUEL_01
          cat > src/main/resources/config.yml <<'EOF_DUEL_02'
          # ===== Duel: настройки дуэлей =====
          # Карты, сеты и точки задаются в игре через /aduel (хранятся в maps.yml).
          # Статистика хранится в stats.yml. Вещи игроков на время дуэли лежат в папке saved/.

          # Сколько секунд после создания дуэли ждём игроков. Потом старт с тем, кто есть
          # (команды могут быть неравными, например 5 на 1). Если соперников нет, дуэль отменяется.
          lobby-wait-seconds: 70

          # Сколько секунд игроки стоят на спавнах перед боем.
          countdown-seconds: 12

          # Максимальная длительность боя в секундах (потом ничья).
          match-time-seconds: 600

          # Максимальный размер команды (ползунок 1x1 ... NxN). От 2 до 5.
          max-team-size: 5

          # Граница дуэли вокруг общей точки карты.
          border:
            # Сколько блоков можно отойти в стороны (по X и Z).
            radius: 20
            # Сколько блоков можно подняться вверх.
            up: 15
            # Сколько блоков можно опуститься вниз.
            down: 30
            # Если игрок ушёл за границу на столько блоков, его телепортирует на спавн.
            teleport-back-excess: 10

          build:
            # Строить можно до этой высоты над общей точкой включительно (10 можно, 11 нельзя).
            max-height: 10
            # Блоки, которые ставить нельзя (часть названия блока, без учёта регистра).
            forbidden-blocks: [tnt, lava, fire, sand, gravel, powder, anvil, dragon egg]

          # Предметы, которыми нельзя пользоваться на арене (часть названия).
          forbidden-items: [flint, fire charge, tnt, lava]

          # Блоки, с которыми нельзя взаимодействовать на арене (сундуки, печи и т.д.).
          blocked-interact-blocks: [chest, furnace, barrel, hopper, dropper, dispenser, shulker, anvil, enchant, brewing, beacon, smoker, blast, loom, grindstone]

          # Команды, разрешённые во время дуэли. Все остальные (телепорты, /gm, /fly и др.) блокируются.
          allowed-commands: [duel]

          password:
            min-length: 3
            max-length: 16

          teams:
            red-name: "Красные"
            blue-name: "Синие"
            # Цвета ников на время дуэли.
            red-color: "§c"
            blue-color: "§9"

          # Как часто (в секундах) статистика сохраняется на диск.
          stats-save-seconds: 30
          EOF_DUEL_02
          cat > src/main/java/ru/eclips/duel/DuelListener.java <<'EOF_DUEL_03'
          package ru.eclips.duel;

          import cn.nukkit.Player;
          import cn.nukkit.block.Block;
          import cn.nukkit.entity.Entity;
          import cn.nukkit.event.EventHandler;
          import cn.nukkit.event.EventPriority;
          import cn.nukkit.event.Listener;
          import cn.nukkit.event.block.BlockBreakEvent;
          import cn.nukkit.event.block.BlockPlaceEvent;
          import cn.nukkit.event.entity.EntityDamageByEntityEvent;
          import cn.nukkit.event.entity.EntityDamageEvent;
          import cn.nukkit.event.entity.EntityExplodeEvent;
          import cn.nukkit.event.player.PlayerBucketEmptyEvent;
          import cn.nukkit.event.player.PlayerBucketFillEvent;
          import cn.nukkit.event.player.PlayerCommandPreprocessEvent;
          import cn.nukkit.event.player.PlayerDeathEvent;
          import cn.nukkit.event.player.PlayerDropItemEvent;
          import cn.nukkit.event.player.PlayerFormRespondedEvent;
          import cn.nukkit.event.player.PlayerInteractEvent;
          import cn.nukkit.event.player.PlayerJoinEvent;
          import cn.nukkit.event.player.PlayerMoveEvent;
          import cn.nukkit.event.player.PlayerQuitEvent;
          import cn.nukkit.event.player.PlayerRespawnEvent;
          import cn.nukkit.event.player.PlayerTeleportEvent;
          import cn.nukkit.item.Item;
          import cn.nukkit.level.Location;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.UUID;

          /** События: защита арены, смерть без дропа, границы, блокировки команд и телепортов. */
          public final class DuelListener implements Listener {
              private final DuelPlugin plugin;
              private final Map<UUID, Long> lastWarn = new HashMap<>();

              public DuelListener(DuelPlugin plugin) {
                  this.plugin = plugin;
              }

              private Match of(Player p) {
                  return plugin.manager.matchOf(p.getUniqueId());
              }

              private static boolean hasAny(String text, java.util.List<String> parts) {
                  if (text == null) {
                      return false;
                  }
                  String t = text.toLowerCase(Locale.ROOT);
                  for (String s : parts) {
                      if (t.contains(s)) {
                          return true;
                      }
                  }
                  return false;
              }

              private void warn(Player p, String msg) {
                  long now = System.currentTimeMillis();
                  Long last = lastWarn.get(p.getUniqueId());
                  if (last == null || now - last > 1500) {
                      lastWarn.put(p.getUniqueId(), now);
                      p.sendMessage(msg);
                  }
              }

              // ---------------- вход / выход ----------------

              @EventHandler(priority = EventPriority.NORMAL)
              public void onJoin(PlayerJoinEvent e) {
                  final Player p = e.getPlayer();
                  plugin.later(() -> plugin.restorePending(p), 20);
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onQuit(PlayerQuitEvent e) {
                  Player p = e.getPlayer();
                  plugin.forms.forget(p.getUniqueId());
                  lastWarn.remove(p.getUniqueId());
                  Match m = of(p);
                  if (m != null) {
                      try {
                          m.leave(p, true);
                      } catch (Throwable t) {
                          plugin.getLogger().warning("Duel quit error: " + t);
                      }
                  }
              }

              @EventHandler(priority = EventPriority.NORMAL)
              public void onForm(PlayerFormRespondedEvent e) {
                  plugin.forms.onResponse(e);
              }

              // ---------------- движение и границы ----------------

              @EventHandler(priority = EventPriority.HIGH)
              public void onMove(PlayerMoveEvent e) {
                  Player p = e.getPlayer();
                  Match m = of(p);
                  if (m == null) {
                      return;
                  }
                  Location f = e.getFrom();
                  Location t = e.getTo();
                  if (f == null || t == null) {
                      return;
                  }
                  Match.Member mb = m.member(p.getUniqueId());
                  if (mb != null && mb.frozen) {
                      if (f.getX() != t.getX() || f.getZ() != t.getZ() || t.getY() > f.getY() + 0.05) {
                          e.setCancelled(true);
                      }
                      return;
                  }
                  Settings s = plugin.settings;
                  double ef = m.map.excess(s, f.getX(), f.getY(), f.getZ());
                  double et = m.map.excess(s, t.getX(), t.getY(), t.getZ());
                  if (et > 0 && et > ef) {
                      e.setCancelled(true);
                      warn(p, Msg.err("Вы вышли за пределы дуэли."));
                  }
              }

              @EventHandler(priority = EventPriority.HIGH)
              public void onTeleport(PlayerTeleportEvent e) {
                  Player p = e.getPlayer();
                  Match m = of(p);
                  if (m == null || plugin.isTpAllowed(p.getUniqueId())) {
                      return;
                  }
                  String cause = "";
                  try {
                      cause = e.getCause() == null ? "" : e.getCause().name();
                  } catch (Throwable ignored) {
                  }
                  Location to = e.getTo();
                  if ((cause.equals("ENDER_PEARL") || cause.equals("CHORUS_FRUIT")) && to != null && to.getLevel() == p.getLevel()
                          && m.map.excess(plugin.settings, to.getX(), to.getY(), to.getZ()) <= 0) {
                      return;
                  }
                  e.setCancelled(true);
              }

              @EventHandler(priority = EventPriority.HIGH)
              public void onCommand(PlayerCommandPreprocessEvent e) {
                  Player p = e.getPlayer();
                  if (of(p) == null) {
                      return;
                  }
                  String msg = e.getMessage();
                  if (msg == null || !msg.startsWith("/")) {
                      return;
                  }
                  String cmd = msg.substring(1).trim().split("\\s+")[0].toLowerCase(Locale.ROOT);
                  int colon = cmd.indexOf(':');
                  if (colon >= 0) {
                      cmd = cmd.substring(colon + 1);
                  }
                  if (plugin.settings.allowedCommands.contains(cmd)) {
                      return;
                  }
                  e.setCancelled(true);
                  p.sendMessage(Msg.err("Во время дуэли команды отключены. Выйти можно через /duel."));
              }

              // ---------------- урон и смерть ----------------

              @EventHandler(priority = EventPriority.HIGH)
              public void onDamage(EntityDamageEvent e) {
                  Entity ent = e.getEntity();
                  if (!(ent instanceof Player)) {
                      return;
                  }
                  Player v = (Player) ent;
                  Match m = of(v);
                  if (m == null) {
                      if (e instanceof EntityDamageByEntityEvent) {
                          Entity d = ((EntityDamageByEntityEvent) e).getDamager();
                          if (d instanceof Player && of((Player) d) != null) {
                              e.setCancelled(true);
                          }
                      }
                      return;
                  }
                  Match.Member vm = m.member(v.getUniqueId());
                  if (m.state != Match.State.RUNNING || vm == null || !vm.alive) {
                      e.setCancelled(true);
                      return;
                  }
                  Player killer = null;
                  if (e instanceof EntityDamageByEntityEvent) {
                      Entity d = ((EntityDamageByEntityEvent) e).getDamager();
                      if (d instanceof Player) {
                          Player dp = (Player) d;
                          Match dm = of(dp);
                          Match.Member dmem = dm == null ? null : dm.member(dp.getUniqueId());
                          if (dm != m || dmem == null || !dmem.alive || dmem.team == vm.team) {
                              e.setCancelled(true);
                              return;
                          }
                          killer = dp;
                      }
                  }
                  if (e.getFinalDamage() >= v.getHealth()) {
                      e.setCancelled(true);
                      m.onDeath(v, killer);
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onDeath(PlayerDeathEvent e) {
                  final Player v = e.getEntity();
                  final Match m = of(v);
                  if (m == null) {
                      return;
                  }
                  e.setKeepInventory(true);
                  e.setKeepExperience(true);
                  e.setDrops(new Item[0]);
                  Refl.run(e, "setDeathMessage", "");
                  Match.Member mb = m.member(v.getUniqueId());
                  if (mb != null) {
                      mb.deathPending = true;
                      try {
                          EntityDamageEvent c = v.getLastDamageCause();
                          if (c instanceof EntityDamageByEntityEvent) {
                              Entity d = ((EntityDamageByEntityEvent) c).getDamager();
                              if (d instanceof Player) {
                                  mb.pendingKiller = ((Player) d).getUniqueId();
                              }
                          }
                      } catch (Throwable ignored) {
                      }
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onRespawn(PlayerRespawnEvent e) {
                  final Player p = e.getPlayer();
                  final Match m = of(p);
                  if (m == null) {
                      return;
                  }
                  final Match.Member mb = m.member(p.getUniqueId());
                  if (mb == null || !mb.deathPending) {
                      return;
                  }
                  try {
                      Location l = plugin.loc(m.map.lobby, 0, 0);
                      if (l != null) {
                          e.setRespawnPosition(l);
                      }
                  } catch (Throwable ignored) {
                  }
                  plugin.later(() -> {
                      Match cur = of(p);
                      if (cur == m && p.isOnline()) {
                          Player killer = mb.pendingKiller == null ? null : plugin.online(mb.pendingKiller);
                          m.onDeath(p, killer);
                      }
                  }, 2);
              }

              // ---------------- предметы и блоки ----------------

              @EventHandler(priority = EventPriority.HIGH)
              public void onDrop(PlayerDropItemEvent e) {
                  if (of(e.getPlayer()) != null) {
                      e.setCancelled(true);
                  }
              }

              @EventHandler(priority = EventPriority.HIGH)
              public void onInteract(PlayerInteractEvent e) {
                  Player p = e.getPlayer();
                  Match m = of(p);
                  if (m == null) {
                      return;
                  }
                  Item it = e.getItem();
                  String action = "";
                  try {
                      action = e.getAction() == null ? "" : e.getAction().name();
                  } catch (Throwable ignored) {
                  }
                  if (m.state == Match.State.WAITING && Util.isCompass(it)) {
                      e.setCancelled(true);
                      if (action.startsWith("RIGHT_CLICK") && !plugin.forms.hasPending(p.getUniqueId())) {
                          plugin.forms.openTeam(p, m);
                      }
                      return;
                  }
                  Match.Member mb = m.member(p.getUniqueId());
                  if (m.state != Match.State.RUNNING || mb == null || !mb.alive) {
                      e.setCancelled(true);
                      return;
                  }
                  if (it != null && !it.isNull() && hasAny(it.getName(), plugin.settings.forbiddenItems)) {
                      e.setCancelled(true);
                      return;
                  }
                  Block b = e.getBlock();
                  if (b != null && action.equals("RIGHT_CLICK_BLOCK") && hasAny(b.getName(), plugin.settings.interactBlocks)) {
                      e.setCancelled(true);
                  }
              }

              @EventHandler(priority = EventPriority.HIGH)
              public void onPlace(BlockPlaceEvent e) {
                  Player p = e.getPlayer();
                  Match m = of(p);
                  if (m == null) {
                      return;
                  }
                  Match.Member mb = m.member(p.getUniqueId());
                  if (m.state != Match.State.RUNNING || mb == null || !mb.alive) {
                      e.setCancelled(true);
                      return;
                  }
                  Block b = e.getBlock();
                  if (hasAny(b.getName(), plugin.settings.forbiddenBlocks)) {
                      e.setCancelled(true);
                      warn(p, Msg.err("Этот блок нельзя ставить на арене."));
                      return;
                  }
                  if (!m.map.canBuild(plugin.settings, b.getFloorX(), b.getFloorY(), b.getFloorZ())) {
                      e.setCancelled(true);
                      warn(p, Msg.err("Здесь строить нельзя: слишком далеко или слишком высоко."));
                  }
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onPlaceDone(BlockPlaceEvent e) {
                  Match m = of(e.getPlayer());
                  if (m != null && !e.isCancelled()) {
                      Block b = e.getBlock();
                      m.markPlaced(b.getFloorX(), b.getFloorY(), b.getFloorZ());
                  }
              }

              @EventHandler(priority = EventPriority.HIGH)
              public void onBreak(BlockBreakEvent e) {
                  Player p = e.getPlayer();
                  Match m = of(p);
                  if (m == null) {
                      return;
                  }
                  Match.Member mb = m.member(p.getUniqueId());
                  Block b = e.getBlock();
                  if (m.state != Match.State.RUNNING || mb == null || !mb.alive
                          || !m.isPlaced(b.getFloorX(), b.getFloorY(), b.getFloorZ())) {
                      e.setCancelled(true);
                      return;
                  }
                  e.setDrops(new Item[0]);
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onBreakDone(BlockBreakEvent e) {
                  Match m = of(e.getPlayer());
                  if (m != null && !e.isCancelled()) {
                      Block b = e.getBlock();
                      m.unmarkPlaced(b.getFloorX(), b.getFloorY(), b.getFloorZ());
                  }
              }

              @EventHandler(priority = EventPriority.HIGH)
              public void onBucketEmpty(PlayerBucketEmptyEvent e) {
                  if (of(e.getPlayer()) != null) {
                      e.setCancelled(true);
                  }
              }

              @EventHandler(priority = EventPriority.HIGH)
              public void onBucketFill(PlayerBucketFillEvent e) {
                  if (of(e.getPlayer()) != null) {
                      e.setCancelled(true);
                  }
              }

              /** Взрывы на арене урон наносят, но блоки не ломают. */
              @EventHandler(priority = EventPriority.HIGH)
              public void onExplode(EntityExplodeEvent e) {
                  try {
                      Entity ent = e.getEntity();
                      if (ent == null || ent.getLevel() == null) {
                          return;
                      }
                      String lvl = ent.getLevel().getFolderName();
                      for (Match m : plugin.manager.all()) {
                          if (m.map.lobby != null && m.map.lobby.level.equals(lvl)
                                  && m.map.excess(plugin.settings, ent.getX(), ent.getY(), ent.getZ()) <= 0) {
                              e.setBlockList(new ArrayList<Block>());
                              return;
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }
          }
          EOF_DUEL_03
          cat > src/main/java/ru/eclips/duel/DuelManager.java <<'EOF_DUEL_04'
          package ru.eclips.duel;

          import cn.nukkit.Player;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;

          /** Реестр дуэлей: на одну карту одна дуэль за раз. */
          public final class DuelManager {
              private final DuelPlugin plugin;
              private final Map<String, Match> byMap = new LinkedHashMap<>();
              private final Map<UUID, Match> byPlayer = new HashMap<>();

              public DuelManager(DuelPlugin plugin) {
                  this.plugin = plugin;
              }

              public Match matchOf(UUID id) {
                  return byPlayer.get(id);
              }

              public boolean isBusy(String mapName) {
                  return byMap.containsKey(mapName.toLowerCase());
              }

              public List<Match> all() {
                  return new ArrayList<>(byMap.values());
              }

              public List<Match> waiting() {
                  List<Match> out = new ArrayList<>();
                  for (Match m : byMap.values()) {
                      if (m.state == Match.State.WAITING && !m.isFull()) {
                          out.add(m);
                      }
                  }
                  return out;
              }

              void bind(Match m, UUID id) {
                  byPlayer.put(id, m);
              }

              void unbind(UUID id) {
                  byPlayer.remove(id);
              }

              void unregister(Match m) {
                  byMap.remove(m.map.name.toLowerCase());
                  for (UUID id : new ArrayList<>(byPlayer.keySet())) {
                      if (byPlayer.get(id) == m) {
                          byPlayer.remove(id);
                      }
                  }
              }

              /** Общие условия входа в дуэль. Возвращает текст причины или null. */
              public String cannotEnter(Player p) {
                  if (byPlayer.containsKey(p.getUniqueId())) {
                      return "Ты уже участвуешь в дуэли.";
                  }
                  try {
                      if (p.getGamemode() != 0) {
                          return "Для дуэли нужен режим выживания.";
                      }
                      if (p.getHealth() <= 0) {
                          return "Сейчас нельзя войти в дуэль.";
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              public Match create(Player p, DuelMap map, int size, String password) {
                  String why = cannotEnter(p);
                  if (why != null) {
                      p.sendMessage(Msg.err(why));
                      return null;
                  }
                  if (!map.isReady(plugin.settings)) {
                      p.sendMessage(Msg.err("Эта карта сейчас недоступна."));
                      return null;
                  }
                  if (isBusy(map.name)) {
                      p.sendMessage(Msg.err("Эта карта уже занята другой дуэлью."));
                      return null;
                  }
                  Match m = new Match(plugin, map, p.getName(), size, password);
                  byMap.put(map.name.toLowerCase(), m);
                  if (!m.addPlayer(p)) {
                      byMap.remove(map.name.toLowerCase());
                      return null;
                  }
                  return m;
              }

              public boolean join(Player p, Match m) {
                  String why = cannotEnter(p);
                  if (why != null) {
                      p.sendMessage(Msg.err(why));
                      return false;
                  }
                  if (m.state != Match.State.WAITING || m.isFull()) {
                      p.sendMessage(Msg.err("В эту дуэль уже нельзя войти."));
                      return false;
                  }
                  return m.addPlayer(p);
              }

              public void tick() {
                  for (Match m : all()) {
                      try {
                          m.tick();
                      } catch (Throwable t) {
                          plugin.getLogger().warning("Duel tick error: " + t);
                          try {
                              m.finish(null, "Дуэль прервана из-за внутренней ошибки.");
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }

              public void endAll(String reason) {
                  for (Match m : all()) {
                      try {
                          m.finish(null, reason);
                      } catch (Throwable ignored) {
                      }
                  }
              }
          }
