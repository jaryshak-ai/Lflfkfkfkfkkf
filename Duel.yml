          package ru.eclips.duel;

          import cn.nukkit.item.Item;
          import cn.nukkit.nbt.NBTIO;
          import cn.nukkit.nbt.tag.CompoundTag;

          import java.nio.ByteOrder;
          import java.util.Base64;

          /** Предмет <-> строка. Вариант 1: NBT. Вариант 2 (запасной): id:meta:count:nbt. */
          public final class ItemCodec {
              private ItemCodec() {
              }

              public static boolean isEmpty(Item item) {
                  return item == null || item.isNull();
              }

              public static Item air() {
                  return Item.get(0);
              }

              public static String encode(Item item) {
                  if (isEmpty(item)) {
                      return "";
                  }
                  try {
                      CompoundTag tag = NBTIO.putItemHelper(item);
                      byte[] data = NBTIO.write(tag, ByteOrder.LITTLE_ENDIAN, false);
                      return "N:" + Base64.getEncoder().encodeToString(data);
                  } catch (Throwable ignored) {
                  }
                  try {
                      byte[] nbt = item.getCompoundTag();
                      return "L:" + item.getId() + ":" + item.getDamage() + ":" + item.getCount() + ":"
                              + (nbt == null ? "" : Base64.getEncoder().encodeToString(nbt));
                  } catch (Throwable ignored) {
                  }
                  return "";
              }

              public static Item decode(String s) {
                  if (s == null || s.isEmpty()) {
                      return null;
                  }
                  try {
                      if (s.startsWith("N:")) {
                          byte[] data = Base64.getDecoder().decode(s.substring(2));
                          CompoundTag tag = NBTIO.read(data, ByteOrder.LITTLE_ENDIAN, false);
                          Item it = NBTIO.getItemHelper(tag);
                          return isEmpty(it) ? null : it;
                      }
                      if (s.startsWith("L:")) {
                          String[] p = s.split(":", 5);
                          Item it = Item.get(Integer.parseInt(p[1]), Integer.parseInt(p[2]), Integer.parseInt(p[3]));
                          if (p.length > 4 && !p[4].isEmpty()) {
                              it.setCompoundTag(Base64.getDecoder().decode(p[4]));
                          }
                          return isEmpty(it) ? null : it;
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }
          }
