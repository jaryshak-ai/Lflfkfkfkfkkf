              private void openPassword(Player p, Match m) {
                  FormWindowCustom f = new FormWindowCustom("Закрытая арена");
                  f.addElement(new ElementInput("Введи пароль арены", "пароль", ""));
                  open(p, f, (pl, r, closed) -> {
                      if (closed) {
