          package ru.eclips.duel;

          import cn.nukkit.Player;
          import cn.nukkit.event.player.PlayerFormRespondedEvent;
          import cn.nukkit.form.element.ElementButton;
          import cn.nukkit.form.element.ElementInput;
          import cn.nukkit.form.element.ElementSlider;
          import cn.nukkit.form.element.ElementToggle;
          import cn.nukkit.form.response.FormResponseCustom;
          import cn.nukkit.form.response.FormResponseModal;
          import cn.nukkit.form.response.FormResponseSimple;
          import cn.nukkit.form.window.FormWindow;
          import cn.nukkit.form.window.FormWindowCustom;
          import cn.nukkit.form.window.FormWindowSimple;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;

          /** Все графические меню /duel и /aduel. Кнопки жирные и тёмные: читаются на серых кнопках. */
          public final class FormUI {
              public interface Handler {
                  void handle(Player p, Object response, boolean closed);
              }

              private static final class Pending {
                  final int id;
                  final Handler h;

                  Pending(int id, Handler h) {
                      this.id = id;
                      this.h = h;
                  }
              }

              private final DuelPlugin plugin;
              private final Map<UUID, Pending> pending = new ConcurrentHashMap<>();

              public FormUI(DuelPlugin plugin) {
                  this.plugin = plugin;
              }

              // ---------------- ядро ----------------

              public void open(Player p, FormWindow w, Handler h) {
                  try {
                      int id = p.showFormWindow(w);
                      pending.put(p.getUniqueId(), new Pending(id, h));
                  } catch (Throwable ignored) {
                  }
              }

              public void forget(UUID id) {
                  pending.remove(id);
              }

              public boolean hasPending(UUID id) {
                  return pending.containsKey(id);
              }

              public void onResponse(PlayerFormRespondedEvent e) {
                  Player p = e.getPlayer();
                  Pending pd = pending.get(p.getUniqueId());
                  if (pd == null || pd.id != e.getFormID()) {
                      return;
                  }
                  pending.remove(p.getUniqueId());
                  boolean closed = e.wasClosed();
                  try {
                      pd.h.handle(p, closed ? null : e.getResponse(), closed);
                  } catch (Throwable t) {
                      plugin.getLogger().warning("Form handler error: " + t);
                  }
              }

              private static int clicked(Object r) {
                  if (r instanceof FormResponseSimple) {
                      return ((FormResponseSimple) r).getClickedButtonId();
                  }
                  if (r instanceof FormResponseModal) {
                      return ((FormResponseModal) r).getClickedButtonId();
                  }
                  return -1;
              }

              private static Map<Integer, Object> answers(Object r) {
                  Map<Integer, Object> out = new HashMap<>();
                  if (r instanceof FormResponseCustom) {
                      Map<Integer, Object> m = ((FormResponseCustom) r).getResponses();
                      if (m != null) {
                          out.putAll(m);
                      }
                  }
                  return out;
              }

              private static ElementButton button(String text) {
                  return new ElementButton(Msg.btn(text));
              }

              private static ElementButton button2(String a, String b) {
                  return new ElementButton(Msg.btn2(a, b));
              }

              /** Простое окно с одной кнопкой. */
              public void info(Player p, String title, String body, Runnable after) {
                  FormWindowSimple f = new FormWindowSimple(title, body);
                  f.addButton(button("Назад"));
                  open(p, f, (pl, r, closed) -> {
                      if (!closed && after != null) {
                          after.run();
                      }
                  });
              }

              /** Окно подтверждения: Да / Нет. */
              private void confirm(Player p, String title, String body, Runnable yes, Runnable no) {
                  FormWindowSimple f = new FormWindowSimple(title, body);
                  f.addButton(button("Да"));
                  f.addButton(button("Нет"));
                  open(p, f, (pl, r, closed) -> {
                      if (closed) {
                          return;
                      }
                      if (clicked(r) == 0) {
                          if (yes != null) {
                              yes.run();
                          }
                      } else if (no != null) {
                          no.run();
                      }
                  });
              }

              // ---------------- меню игрока ----------------

              public void openMain(Player p) {
                  Match mt = plugin.manager.matchOf(p.getUniqueId());
                  if (mt != null) {
                      openInMatch(p, mt);
                      return;
                  }
                  FormWindowSimple f = new FormWindowSimple("Дуэли", "Выбери действие:");
                  f.addButton(button("Создать дуэль"));
                  f.addButton(button("Присоединиться к дуэли"));
                  f.addButton(button("Моя статистика"));
                  f.addButton(button("Топ 10 игроков"));
                  open(p, f, (pl, r, closed) -> {
                      if (closed) {
                          return;
                      }
                      switch (clicked(r)) {
                          case 0:
                              openCreateMaps(pl);
                              break;
                          case 1:
                              openJoinList(pl);
                              break;
                          case 2:
                              openStats(pl);
                              break;
                          case 3:
                              openTop(pl);
                              break;
                          default:
                              break;
                      }
                  });
              }

              private void openInMatch(Player p, Match mt) {
                  String state;
                  switch (mt.state) {
                      case WAITING:
                          state = "ожидание игроков";
                          break;
                      case COUNTDOWN:
                          state = "подготовка к бою";
                          break;
                      default:
                          state = "бой идёт";
                          break;
                  }
                  FormWindowSimple f = new FormWindowSimple("Дуэль", "Карта: " + mt.map.name + " (" + mt.size + "x" + mt.size + ")\n"
                          + "Состояние: " + state + "\nИгроков: " + mt.count() + "/" + (mt.size * 2));
                  f.addButton(button("Покинуть дуэль"));
                  f.addButton(button("Закрыть"));
                  open(p, f, (pl, r, closed) -> {
                      if (closed || clicked(r) != 0) {
                          return;
                      }
                      String warn = mt.state == Match.State.RUNNING
                              ? "Выход во время боя засчитывается как поражение. Вещи вернутся. Выйти?"
                              : "Ты выйдешь из дуэли, вещи вернутся. Выйти?";
                      confirm(pl, "Покинуть дуэль", warn, () -> {
                          Match cur = plugin.manager.matchOf(pl.getUniqueId());
                          if (cur != null) {
                              cur.leave(pl, false);
                          }
                      }, null);
                  });
              }

              // ---- создание ----

              private void openCreateMaps(Player p) {
                  String why = plugin.manager.cannotEnter(p);
                  if (why != null) {
                      info(p, "Дуэли", why, () -> openMain(p));
                      return;
                  }
                  List<DuelMap> ready = new ArrayList<>();
                  for (DuelMap m : plugin.maps.all()) {
                      if (m.isReady(plugin.settings)) {
                          ready.add(m);
                      }
                  }
                  if (ready.isEmpty()) {
                      info(p, "Создать дуэль", "Пока нет готовых карт для дуэлей.", () -> openMain(p));
                      return;
                  }
                  FormWindowSimple f = new FormWindowSimple("Создать дуэль", "Выбери карту:");
                  for (DuelMap m : ready) {
                      f.addButton(button2(m.name, plugin.manager.isBusy(m.name) ? "занята" : "свободна"));
                  }
                  f.addButton(button("Назад"));
                  open(p, f, (pl, r, closed) -> {
                      if (closed) {
                          return;
                      }
                      int i = clicked(r);
                      if (i < 0 || i >= ready.size()) {
                          openMain(pl);
                          return;
                      }
                      DuelMap m = ready.get(i);
                      if (plugin.manager.isBusy(m.name)) {
                          info(pl, "Создать дуэль", "Эта карта сейчас занята. Выбери другую.", () -> openCreateMaps(pl));
                          return;
                      }
                      openCreateSettings(pl, m, 1, false, "");
                  });
              }

              private void openCreateSettings(Player p, DuelMap map, int defSize, boolean defClosed, String defPw) {
                  int max = plugin.settings.maxTeam;
                  int pwMin = plugin.settings.pwMin;
                  int pwMax = plugin.settings.pwMax;
                  FormWindowCustom f = new FormWindowCustom("Дуэль: " + map.name);
                  f.addElement(new ElementSlider("Размер дуэли: игроков в каждой команде (от 1x1 до " + max + "x" + max + ")", 1, max, 1,
                          Math.max(1, Math.min(defSize, max))));
                  f.addElement(new ElementToggle("Закрытая арена (вход только по паролю)", defClosed));
                  f.addElement(new ElementInput("Пароль (если арена закрытая)", "от " + pwMin + " до " + pwMax + " символов", defPw));
                  open(p, f, (pl, r, closed) -> {
                      if (closed) {
                          return;
                      }
                      Map<Integer, Object> a = answers(r);
                      int size = a.get(0) instanceof Number ? Math.round(((Number) a.get(0)).floatValue()) : 1;
                      size = Math.max(1, Math.min(size, max));
                      boolean priv = Boolean.TRUE.equals(a.get(1));
                      String pw = a.get(2) == null ? "" : String.valueOf(a.get(2)).trim();
                      if (priv && (pw.length() < pwMin || pw.length() > pwMax || pw.contains(" "))) {
                          final int fs = size;
                          final String fpw = pw;
                          info(pl, "Пароль", "Пароль должен быть от " + pwMin + " до " + pwMax + " символов, без пробелов.",
                                  () -> openCreateSettings(pl, map, fs, true, fpw));
                          return;
                      }
                      plugin.manager.create(pl, map, size, priv ? pw : null);
                  });
              }

              // ---- присоединение ----

              private void openJoinList(Player p) {
                  String why = plugin.manager.cannotEnter(p);
                  if (why != null) {
                      info(p, "Дуэли", why, () -> openMain(p));
                      return;
                  }
                  List<Match> list = plugin.manager.waiting();
                  if (list.isEmpty()) {
                      info(p, "Присоединиться", "Сейчас нет открытых дуэлей. Создай свою!", () -> openMain(p));
                      return;
                  }
                  FormWindowSimple f = new FormWindowSimple("Присоединиться", "Выбери дуэль:");
                  for (Match m : list) {
                      f.addButton(button2(m.map.name + "  " + m.size + "x" + m.size + (m.hasPassword() ? "  [пароль]" : ""),
                              "Создал: " + m.creator + "  Игроков: " + m.count() + "/" + (m.size * 2)));
                  }
                  f.addButton(button("Назад"));
                  open(p, f, (pl, r, closed) -> {
