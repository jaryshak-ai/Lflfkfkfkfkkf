          package ru.eclips.duel;

          import cn.nukkit.utils.Config;
          import cn.nukkit.utils.ConfigSection;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;
          import java.util.UUID;

          /** Статистика игроков (stats.yml). Запись на диск асинхронная и пачками. */
          public final class StatsStore {
              public static final class Row {
                  public String name = "?";
                  public int wins;
                  public int losses;
                  public int kills;
                  public int deaths;

                  public double kd() {
                      return kills / (double) Math.max(1, deaths);
                  }

                  public String kdText() {
                      return String.format(Locale.US, "%.2f", kd());
                  }
              }

              private final Config cfg;
              private boolean dirty;

              public StatsStore(File file) {
                  cfg = new Config(file, Config.YAML);
              }

              private static String base(UUID id) {
                  return "players.u_" + id;
              }

              public synchronized void add(UUID id, String name, String field, int delta) {
                  try {
                      String b = base(id);
                      cfg.set(b + ".name", name);
                      cfg.set(b + "." + field, cfg.getInt(b + "." + field, 0) + delta);
                      dirty = true;
                  } catch (Throwable ignored) {
                  }
              }

              public synchronized Row get(UUID id) {
                  Row r = new Row();
                  try {
                      String b = base(id);
                      r.name = cfg.getString(b + ".name", "?");
                      r.wins = cfg.getInt(b + ".wins", 0);
                      r.losses = cfg.getInt(b + ".losses", 0);
                      r.kills = cfg.getInt(b + ".kills", 0);
                      r.deaths = cfg.getInt(b + ".deaths", 0);
                  } catch (Throwable ignored) {
                  }
                  return r;
              }

              public synchronized List<Row> top(int n) {
                  List<Row> rows = new ArrayList<>();
                  try {
                      ConfigSection sec = cfg.getSection("players");
                      for (String key : sec.getKeys(false)) {
                          String b = "players." + key;
                          Row r = new Row();
                          r.name = cfg.getString(b + ".name", "?");
                          r.wins = cfg.getInt(b + ".wins", 0);
                          r.losses = cfg.getInt(b + ".losses", 0);
                          r.kills = cfg.getInt(b + ".kills", 0);
                          r.deaths = cfg.getInt(b + ".deaths", 0);
                          if (r.wins > 0) {
                              rows.add(r);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  Collections.sort(rows, (a, b) -> {
                      if (a.wins != b.wins) {
                          return Integer.compare(b.wins, a.wins);
                      }
                      return Double.compare(b.kd(), a.kd());
                  });
                  return rows.size() > n ? new ArrayList<>(rows.subList(0, n)) : rows;
              }

              public synchronized void flush(boolean async) {
                  if (!dirty) {
                      return;
                  }
                  dirty = false;
                  try {
                      if (async) {
                          if (Refl.call(cfg, "save", Boolean.TRUE) == null) {
                              cfg.save();
                          }
                      } else {
                          cfg.save();
                      }
                  } catch (Throwable ignored) {
                  }
              }
          }
