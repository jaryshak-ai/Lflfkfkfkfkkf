          package ru.eclips.duel;

          import cn.nukkit.Player;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.level.Level;
          import cn.nukkit.level.Location;
          import cn.nukkit.level.Position;
          import cn.nukkit.plugin.PluginBase;

          import java.io.File;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;

          /** Дуэли: /duel (игроки) и /aduel (админ). */
          public class DuelPlugin extends PluginBase {
              public final Settings settings = new Settings();
              public MapStore maps;
              public StatsStore stats;
              public DuelManager manager;
              public FormUI forms;
              public File savedDir;
              private final Set<UUID> tpAllowed = ConcurrentHashMap.newKeySet();

              @Override
              public void onEnable() {
                  saveDefaultConfig();
                  settings.load(getConfig());
                  savedDir = new File(getDataFolder(), "saved");
                  savedDir.mkdirs();
                  maps = new MapStore(new File(getDataFolder(), "maps.yml"));
                  stats = new StatsStore(new File(getDataFolder(), "stats.yml"));
                  manager = new DuelManager(this);
                  forms = new FormUI(this);
                  getServer().getPluginManager().registerEvents(new DuelListener(this), this);

                  repeat(() -> manager.tick(), 20);
                  repeat(() -> stats.flush(true), Math.max(5, settings.statsFlush) * 20);

                  // после /reload или рестарта возвращаем вещи всем, кто был на арене
                  for (Player p : getServer().getOnlinePlayers().values()) {
                      restorePending(p);
                  }
                  getLogger().info("Duel включён. Карт: " + maps.all().size());
              }

              @Override
              public void onDisable() {
                  try {
                      manager.endAll("Сервер выключается, дуэль завершена.");
                  } catch (Throwable ignored) {
                  }
                  try {
                      stats.flush(false);
                  } catch (Throwable ignored) {
                  }
              }

              public void reloadAll() {
                  try {
                      reloadConfig();
                      settings.load(getConfig());
                  } catch (Throwable ignored) {
                  }
                  maps.load();
              }

              // ---------------- планировщик ----------------

              public void later(Runnable r, int ticks) {
                  Util.RunTask t = new Util.RunTask(this, r);
                  Object sch = getServer().getScheduler();
                  if (!Refl.run(sch, "scheduleDelayedTask", t, ticks)) {
                      Refl.run(sch, "scheduleDelayedTask", this, t, ticks);
                  }
              }

              private void repeat(Runnable r, int period) {
                  Util.RunTask t = new Util.RunTask(this, r);
                  Object sch = getServer().getScheduler();
                  if (!Refl.run(sch, "scheduleRepeatingTask", t, period)) {
                      Refl.run(sch, "scheduleRepeatingTask", this, t, period);
                  }
              }

              // ---------------- помощники ----------------

              public Player online(UUID id) {
                  return getServer().getOnlinePlayers().get(id);
              }

              public Level getLevel(String name) {
                  if (name == null || name.isEmpty()) {
                      return null;
                  }
                  Level lv = getServer().getLevelByName(name);
                  if (lv == null) {
                      try {
                          getServer().loadLevel(name);
                      } catch (Throwable ignored) {
                      }
                      lv = getServer().getLevelByName(name);
                  }
                  return lv;
              }

              public Location loc(DuelMap.Pt pt, double dx, double dz) {
                  if (pt == null) {
                      return null;
                  }
                  Level lv = getLevel(pt.level);
                  if (lv == null) {
                      return null;
                  }
                  return new Location(pt.x + dx, pt.y, pt.z + dz, pt.yaw, pt.pitch, lv);
              }

              /** Телепорт плагина: другие плагины во время дуэли телепортировать игрока не могут. */
              public boolean teleport(Player p, Location l) {
                  tpAllowed.add(p.getUniqueId());
                  try {
                      return p.teleport(l);
                  } catch (Throwable t) {
                      return false;
                  } finally {
                      tpAllowed.remove(p.getUniqueId());
                  }
              }

              public boolean isTpAllowed(UUID id) {
                  return tpAllowed.contains(id);
              }

              /** Если после краша остался файл с вещами, возвращаем их игроку. */
              public void restorePending(Player p) {
                  try {
                      if (p == null || !p.isOnline() || manager.matchOf(p.getUniqueId()) != null) {
                          return;
                      }
                      File f = PlayerState.file(savedDir, p.getUniqueId());
                      if (!f.isFile()) {
                          return;
                      }
                      PlayerState st = PlayerState.read(f);
                      if (st == null) {
                          getLogger().warning("Не удалось прочитать сохранение " + f.getName());
                          return;
                      }
                      if (st.restore(this, p)) {
                          PlayerState.delete(savedDir, p.getUniqueId());
                          p.sendMessage(Msg.info("Твои вещи после дуэли возвращены."));
                      }
                  } catch (Throwable t) {
                      getLogger().warning("restorePending: " + t);
                  }
              }

              // ---------------- команды ----------------

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  String n = command.getName().toLowerCase();
                  if (!(sender instanceof Player)) {
                      sender.sendMessage("Команда доступна только игрокам в игре.");
                      return true;
                  }
                  Player p = (Player) sender;
                  if (n.equals("duel")) {
                      if (args.length > 0 && args[0].equalsIgnoreCase("leave")) {
                          Match m = manager.matchOf(p.getUniqueId());
                          if (m != null) {
                              m.leave(p, false);
                          }
                          return true;
                      }
                      forms.openMain(p);
                      return true;
                  }
                  if (n.equals("aduel")) {
                      if (!p.isOp() && !p.hasPermission("duel.admin")) {
                          p.sendMessage(Msg.err("Нет прав."));
                          return true;
                      }
                      forms.openAdmin(p);
                      return true;
                  }
                  return false;
              }
          }
