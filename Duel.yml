          package ru.eclips.duel;

          import java.util.regex.Pattern;

          /** Тексты и цвета. Все сообщения читаются и на тёмном, и на светлом фоне. */
          public final class Msg {
              public static final String COMPASS_NAME = "§l§6Выбор команды §r§6(нажми ПКМ)";
              private static final Pattern COLOR = Pattern.compile("§[0-9a-fk-orA-FK-OR]");

              private Msg() {
              }

              public static String info(String s) {
                  return "§l§6[Дуэль]§r§6 " + s;
              }

              public static String ok(String s) {
                  return "§l§6[Дуэль]§r§a " + s;
              }

              public static String err(String s) {
                  return "§l§6[Дуэль]§r§c " + s;
              }

              public static String strip(String s) {
                  return s == null ? "" : COLOR.matcher(s).replaceAll("");
              }

              /** Жирный чёрный текст: хорошо читается на серых кнопках форм. */
              public static String btn(String s) {
                  return "§l§0" + s;
              }

              public static String btn2(String a, String b) {
                  return "§l§0" + a + "\n§l§0" + b;
              }

              public static String mmss(int sec) {
                  if (sec < 0) {
                      sec = 0;
                  }
                  int m = sec / 60;
                  int s = sec % 60;
                  return m + ":" + (s < 10 ? "0" : "") + s;
              }
          }
