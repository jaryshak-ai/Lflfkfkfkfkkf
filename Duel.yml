          package ru.eclips.duel;

          import cn.nukkit.Player;
          import cn.nukkit.block.Block;
          import cn.nukkit.item.Item;
          import cn.nukkit.level.Level;
          import cn.nukkit.level.Location;
          import cn.nukkit.math.Vector3;

          import java.util.ArrayList;
          import java.util.Collection;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Random;
          import java.util.Set;
          import java.util.UUID;

          /** Одна дуэль: ожидание, отсчёт, бой, завершение. */
          public final class Match {
              public enum State { WAITING, COUNTDOWN, RUNNING, ENDED }

              public enum Team { RED, BLUE }

              public static final class Member {
                  public final UUID id;
                  public final String name;
                  public Team team;
                  public boolean alive = true;
                  public boolean frozen;
                  public boolean deathPending;
                  public UUID pendingKiller;
                  public int kills;
                  public int outside;
                  PlayerState saved;
                  String origTag = "";

                  Member(UUID id, String name) {
                      this.id = id;
                      this.name = name;
                  }
              }

              private static final double[][] OFFSETS = {{0, 0}, {1, 0}, {-1, 0}, {0, 1}, {0, -1}};

              private final DuelPlugin plugin;
              public final DuelMap map;
              public final String creator;
              public final int size;
              public final String password;
              public State state = State.WAITING;

              private final Map<UUID, Member> members = new LinkedHashMap<>();
              private int waitLeft;
              private int countLeft;
              private int timeLeft;
              private final Set<Long> placed = new HashSet<>();
              private final Random rnd = new Random();

              private Level snapLevel;
              private int[] snapIds;
              private int[] snapMetas;
              private int sx;
              private int sy;
              private int sz;
              private int nx;
              private int ny;

              public Match(DuelPlugin plugin, DuelMap map, String creator, int size, String password) {
                  this.plugin = plugin;
                  this.map = map;
                  this.creator = creator;
                  this.size = size;
                  this.password = password;
                  this.waitLeft = plugin.settings.lobbyWait;
              }

              // ---------------- доступ ----------------

              public boolean hasPassword() {
                  return password != null && !password.isEmpty();
              }

              public int count() {
                  return members.size();
              }

              public boolean isFull() {
                  return members.size() >= size * 2;
              }

              public Member member(UUID id) {
                  return members.get(id);
              }

              public Collection<Member> members() {
                  return new ArrayList<>(members.values());
              }

              public int teamCount(Team t) {
                  int n = 0;
                  for (Member m : members.values()) {
                      if (m.team == t) {
                          n++;
                      }
                  }
                  return n;
              }

              private int aliveCount(Team t) {
                  int n = 0;
                  for (Member m : members.values()) {
                      if (m.team == t && m.alive) {
                          n++;
                      }
                  }
                  return n;
              }

              public String teamLabel(Team t) {
                  Settings s = plugin.settings;
                  return t == Team.RED ? s.redColor + "§l" + s.redName + "§r" : s.blueColor + "§l" + s.blueName + "§r";
              }

              private String teamColor(Team t) {
                  return t == Team.RED ? plugin.settings.redColor : plugin.settings.blueColor;
              }

              public void broadcast(String msg) {
                  for (Member m : members.values()) {
                      Player p = plugin.online(m.id);
                      if (p != null) {
                          p.sendMessage(msg);
                      }
                  }
              }

              // ---------------- блоки, поставленные игроками ----------------

              public static long key(int x, int y, int z) {
                  return (((long) x & 0x3FFFFFFL) << 38) | (((long) z & 0x3FFFFFFL) << 12) | ((long) y & 0xFFFL);
              }

              public void markPlaced(int x, int y, int z) {
                  placed.add(key(x, y, z));
              }

              public boolean isPlaced(int x, int y, int z) {
                  return placed.contains(key(x, y, z));
              }

              public void unmarkPlaced(int x, int y, int z) {
                  placed.remove(key(x, y, z));
              }

              // ---------------- вход ----------------

              public boolean addPlayer(Player p) {
                  if (state != State.WAITING || isFull() || members.containsKey(p.getUniqueId())) {
                      return false;
                  }
                  Location lobby = plugin.loc(map.lobby, 0, 0);
                  if (lobby == null) {
                      return false;
                  }
                  PlayerState st = PlayerState.capture(p);
                  if (!st.safe) {
                      p.sendMessage(Msg.err("Не удалось надёжно сохранить твой инвентарь, поэтому дуэль сейчас недоступна."));
                      return false;
                  }
                  try {
                      st.write(plugin.savedDir, p.getUniqueId());
                  } catch (Throwable t) {
                      p.sendMessage(Msg.err("Не удалось сохранить твой инвентарь, дуэль сейчас недоступна."));
                      return false;
                  }
                  Member mb = new Member(p.getUniqueId(), p.getName());
                  mb.saved = st;
                  mb.origTag = st.nameTag;
                  members.put(mb.id, mb);
                  plugin.manager.bind(this, mb.id);

                  try {
                      p.getInventory().clearAll();
                  } catch (Throwable ignored) {
                  }
                  Util.setOffhand(p, null);
                  Util.clearEffects(p);
                  Util.setFlight(p, false, false);
                  Util.heal(p);
                  try {
                      Item compass = Util.item("compass", 345);
                      compass.setCustomName(Msg.COMPASS_NAME);
                      p.getInventory().setItem(4, compass);
                      Refl.run(p.getInventory(), "setHeldItemIndex", 4);
                  } catch (Throwable ignored) {
                  }
                  plugin.teleport(p, lobby);

                  p.sendMessage(Msg.ok("Ты в дуэли на карте " + map.name + " (" + size + "x" + size + "). Нажми компасом, чтобы выбрать "
                          + "команду. Если не выберешь, команда назначится сама."));
                  broadcast(Msg.info(p.getName() + " присоединился (" + members.size() + "/" + (size * 2) + ")."));
                  checkReadyStart();
                  return true;
              }

              public void chooseTeam(Player p, Team t) {
                  Member mb = members.get(p.getUniqueId());
                  if (mb == null || state != State.WAITING) {
                      return;
                  }
                  if (mb.team != null) {
                      p.sendMessage(Msg.err("Команда уже выбрана, менять её нельзя."));
                      return;
                  }
                  if (teamCount(t) >= size) {
                      p.sendMessage(Msg.err("Эта команда уже заполнена. Выбери другую."));
                      return;
                  }
                  mb.team = t;
                  p.sendMessage(Msg.ok("Ты выбрал команду " + teamLabel(t) + "§r§a. Менять её нельзя."));
                  applyTag(p, mb);
                  checkReadyStart();
              }

              private void checkReadyStart() {
                  if (state != State.WAITING || !isFull()) {
                      return;
                  }
                  boolean allChosen = true;
                  for (Member m : members.values()) {
                      if (m.team == null) {
                          allChosen = false;
                      }
                  }
                  if (allChosen) {
                      startCountdown();
                  } else if (waitLeft > 8) {
                      waitLeft = 8;
                      broadcast(Msg.info("Все собрались! Выбери команду, через 8 секунд начнётся дуэль."));
                  }
              }

              // ---------------- тик (раз в секунду) ----------------

              public void tick() {
                  switch (state) {
                      case WAITING:
                          tickWaiting();
                          break;
                      case COUNTDOWN:
                          tickCountdown();
                          break;
                      case RUNNING:
                          tickRunning();
                          break;
                      default:
                          break;
                  }
              }

              private void tickWaiting() {
                  waitLeft--;
                  if (waitLeft <= 0) {
                      startCountdown();
                      return;
                  }
                  for (Member m : members.values()) {
                      Player p = plugin.online(m.id);
                      if (p == null) {
                          continue;
                      }
                      Util.tip(p, "§l§6Ожидание игроков: " + members.size() + "/" + (size * 2) + "  ·  осталось " + waitLeft + " сек");
                      enforce(p, m);
                  }
              }

              private void tickCountdown() {
                  countLeft--;
                  if (countLeft <= 0) {
                      startFight();
                      return;
                  }
                  for (Member m : members.values()) {
                      Player p = plugin.online(m.id);
                      if (p == null) {
                          continue;
                      }
                      Util.title(p, "§l§6" + countLeft, m.team == null ? "" : "§l" + teamLabel(m.team), 0, 25, 0);
                      applyTag(p, m);
                      enforce(p, m);
                  }
              }

              private void tickRunning() {
                  timeLeft--;
                  if (timeLeft <= 0) {
                      finish(null, "Время вышло, ничья.");
                      return;
                  }
                  String bar = "§l§6" + Msg.mmss(timeLeft) + "  ·  " + teamLabel(Team.RED) + " §l§6" + aliveCount(Team.RED)
                          + "  :  " + aliveCount(Team.BLUE) + " " + teamLabel(Team.BLUE);
                  for (Member m : new ArrayList<>(members.values())) {
                      Player p = plugin.online(m.id);
                      if (p == null) {
                          continue;
                      }
                      Util.tip(p, bar);
                      applyTag(p, m);
                      enforce(p, m);
                  }
              }

              /** Возвращает игрока, если он слишком далеко за границей или завис снаружи. */
              private void enforce(Player p, Member m) {
                  try {
                      double ex = map.excess(plugin.settings, p.getX(), p.getY(), p.getZ());
                      if (ex > 0) {
                          m.outside++;
                          if (ex >= plugin.settings.tpBackExcess || m.outside >= 3) {
                              m.outside = 0;
                              p.sendMessage(Msg.err("Вы вышли за пределы дуэли."));
                              backToSpawn(p, m);
                          }
                      } else {
                          m.outside = 0;
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private void backToSpawn(Player p, Member m) {
                  Location l = null;
                  if (m.team != null && m.alive && (state == State.COUNTDOWN || state == State.RUNNING)) {
                      l = spawnFor(m.team, 0);
                  }
                  if (l == null) {
                      l = plugin.loc(map.lobby, 0, 0);
                  }
                  if (l != null) {
                      plugin.teleport(p, l);
                  }
              }

              private Location spawnFor(Team t, int idx) {
                  DuelMap.Pt base = t == Team.RED ? map.red : map.blue;
                  double[] o = OFFSETS[idx % OFFSETS.length];
                  return plugin.loc(base, o[0], o[1]);
              }

              private void applyTag(Player p, Member m) {
                  if (m.team == null) {
                      return;
                  }
                  try {
                      String src = m.origTag == null || m.origTag.isEmpty() ? p.getName() : m.origTag;
                      String want = teamColor(m.team) + Msg.strip(src);
                      if (!want.equals(p.getNameTag())) {
                          p.setNameTag(want);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              // ---------------- старт ----------------

              private void autoAssign() {
                  List<Member> un = new ArrayList<>();
                  for (Member m : members.values()) {
                      if (m.team == null) {
                          un.add(m);
                      }
                  }
                  Collections.shuffle(un, rnd);
                  for (Member m : un) {
                      int r = teamCount(Team.RED);
                      int b = teamCount(Team.BLUE);
                      Team t;
                      if (r >= size) {
                          t = Team.BLUE;
                      } else if (b >= size) {
                          t = Team.RED;
                      } else if (r < b) {
                          t = Team.RED;
                      } else if (b < r) {
                          t = Team.BLUE;
                      } else {
                          t = rnd.nextBoolean() ? Team.RED : Team.BLUE;
                      }
                      m.team = t;
                  }
              }

              private void startCountdown() {
                  if (state != State.WAITING) {
                      return;
                  }
                  autoAssign();
                  if (teamCount(Team.RED) == 0 || teamCount(Team.BLUE) == 0) {
                      finish(null, "Никто не присоединился, дуэль отменена.");
                      return;
                  }
                  state = State.COUNTDOWN;
                  countLeft = plugin.settings.countdown;
                  takeSnapshot();
                  int ri = 0;
                  int bi = 0;
                  for (Member m : members.values()) {
                      Player p = plugin.online(m.id);
                      if (p == null) {
                          continue;
                      }
                      int idx = m.team == Team.RED ? ri++ : bi++;
                      Location l = spawnFor(m.team, idx);
                      if (l != null) {
                          plugin.teleport(p, l);
                      }
                      map.giveKit(p);
                      Util.heal(p);
                      Util.clearEffects(p);
                      Refl.run(p, "setExperience", 0, 0);
                      m.frozen = true;
                      Util.setImmobile(p, true);
                      applyTag(p, m);
                      p.sendMessage(Msg.info("Твоя команда: " + teamLabel(m.team) + "§r§6. Старт через " + countLeft + " сек."));
                  }
              }

              private void startFight() {
                  state = State.RUNNING;
                  timeLeft = plugin.settings.matchTime;
                  for (Member m : members.values()) {
                      m.frozen = false;
                      Player p = plugin.online(m.id);
                      if (p != null) {
                          Util.setImmobile(p, false);
                          Util.title(p, "§l§aВПЕРЁД!", "§lУдачи в бою", 0, 30, 10);
                      }
                  }
                  broadcast(Msg.ok("Дуэль началась! Время боя: " + Msg.mmss(timeLeft) + "."));
              }

              // ---------------- бой ----------------

              /** Смертельный урон перехвачен: игрок выбывает без дропа. */
              public void onDeath(Player victim, Player killer) {
                  Member vm = members.get(victim.getUniqueId());
                  if (vm == null || state != State.RUNNING || !vm.alive) {
                      return;
                  }
                  vm.alive = false;
                  vm.deathPending = false;
                  plugin.stats.add(vm.id, vm.name, "deaths", 1);
                  Member km = killer == null ? null : members.get(killer.getUniqueId());
                  if (km != null && km.team != vm.team) {
                      km.kills++;
                      plugin.stats.add(km.id, km.name, "kills", 1);
                      broadcast(Msg.info(km.name + " победил в схватке игрока " + vm.name + "."));
                  } else {
                      broadcast(Msg.info(vm.name + " выбыл из боя."));
                  }
                  toSpectator(victim, vm);
                  checkWin();
              }

              private void toSpectator(Player p, Member m) {
                  try {
                      p.getInventory().clearAll();
                      Util.setOffhand(p, null);
                      Util.clearEffects(p);
                      Util.heal(p);
                      p.setGamemode(3);
                      Location l = plugin.loc(map.lobby, 0, 0);
                      if (l != null) {
                          plugin.teleport(p, l);
                      }
                      p.sendMessage(Msg.info("Ты выбыл. Наблюдай за боем или выйди через /duel, вещи вернутся."));
                  } catch (Throwable t) {
                      // запасной вариант: сразу вернуть домой
                      members.remove(m.id);
                      plugin.manager.unbind(m.id);
                      restoreMember(m, p);
                      p.sendMessage(Msg.info("Ты выбыл из дуэли, вещи возвращены."));
                      checkWin();
                  }
              }

              private void checkWin() {
                  if (state != State.RUNNING) {
                      return;
                  }
                  int r = aliveCount(Team.RED);
                  int b = aliveCount(Team.BLUE);
                  if (r > 0 && b > 0) {
                      return;
                  }
                  if (r == 0 && b == 0) {
                      finish(null, "Ничья.");
                  } else {
                      finish(r > 0 ? Team.RED : Team.BLUE, null);
                  }
              }

              // ---------------- выход ----------------

              public void leave(Player p, boolean quitting) {
                  Member mb = members.get(p.getUniqueId());
                  if (mb == null) {
                      return;
                  }
                  if (state == State.RUNNING && mb.alive) {
                      mb.alive = false;
                      plugin.stats.add(mb.id, mb.name, "losses", 1);
                      plugin.stats.add(mb.id, mb.name, "deaths", 1);
                      broadcast(Msg.info(mb.name + " покинул дуэль (поражение)."));
                  } else {
                      broadcast(Msg.info(mb.name + " покинул дуэль."));
                  }
                  members.remove(mb.id);
                  plugin.manager.unbind(mb.id);
                  restoreMember(mb, p);
                  if (!quitting) {
                      p.sendMessage(Msg.ok("Ты вышел из дуэли, вещи возвращены."));
                  }
                  if (state == State.WAITING) {
                      if (members.isEmpty()) {
                          finish(null, null);
                      }
                  } else if (state == State.COUNTDOWN) {
                      if (teamCount(Team.RED) == 0 || teamCount(Team.BLUE) == 0) {
                          finish(null, "Соперник вышел, дуэль отменена.");
                      }
                  } else if (state == State.RUNNING) {
                      checkWin();
                  }
              }

              /** Вернуть игроку его вещи и позицию. Файл удаляется только после полного успеха. */
              private void restoreMember(Member m, Player p) {
                  boolean ok = false;
                  try {
                      m.frozen = false;
                      Util.setImmobile(p, false);
                      ok = m.saved != null && m.saved.restore(plugin, p);
                  } catch (Throwable ignored) {
                  }
                  if (ok) {
                      PlayerState.delete(plugin.savedDir, m.id);
                  }
              }

              // ---------------- конец ----------------

              public void finish(Team winner, String note) {
                  if (state == State.ENDED) {
                      return;
                  }
                  State prev = state;
                  state = State.ENDED;
                  restoreBlocks();
                  boolean played = prev == State.RUNNING;
                  for (Member m : new ArrayList<>(members.values())) {
                      String result;
                      if (played && winner != null) {
                          if (m.team == winner) {
                              plugin.stats.add(m.id, m.name, "wins", 1);
                              result = Msg.ok("Победа! Команда " + teamLabel(winner) + "§r§a выиграла дуэль.");
                          } else {
                              plugin.stats.add(m.id, m.name, "losses", 1);
                              result = Msg.err("Поражение. Выиграла команда " + teamLabel(winner) + "§r§c.");
                          }
                      } else {
                          result = Msg.info(note == null ? "Дуэль завершена." : note);
                      }
                      members.remove(m.id);
                      plugin.manager.unbind(m.id);
                      Player p = plugin.online(m.id);
                      if (p != null) {
                          if (played && winner != null) {
                              Util.title(p, m.team == winner ? "§l§aПОБЕДА" : "§l§cПОРАЖЕНИЕ", "", 5, 40, 10);
                          }
                          restoreMember(m, p);
                          p.sendMessage(result);
                          p.sendMessage(Msg.info("Твои вещи возвращены."));
                      }
                  }
                  plugin.manager.unregister(this);
              }

              // ---------------- откат арены ----------------

              private void takeSnapshot() {
                  try {
                      Level lv = plugin.getLevel(map.lobby.level);
                      if (lv == null) {
                          return;
                      }
                      Settings s = plugin.settings;
                      int r = s.radius + 1;
                      int cx = (int) Math.floor(map.lobby.x);
                      int cz = (int) Math.floor(map.lobby.z);
                      int cy = (int) Math.floor(map.lobby.y);
                      sx = cx - r;
                      sz = cz - r;
                      sy = cy - s.down - 1;
                      nx = 2 * r + 1;
                      ny = s.down + Math.max(s.up, s.buildHeight) + 3;
                      int[] ids = new int[nx * nx * ny];
                      int[] metas = new int[nx * nx * ny];
                      for (int xi = 0; xi < nx; xi++) {
                          for (int zi = 0; zi < nx; zi++) {
                              for (int yi = 0; yi < ny; yi++) {
                                  Block b = lv.getBlock(new Vector3(sx + xi, sy + yi, sz + zi));
                                  int idx = (xi * nx + zi) * ny + yi;
                                  ids[idx] = b.getId();
                                  metas[idx] = Util.meta(b);
                              }
                          }
                      }
                      snapLevel = lv;
                      snapIds = ids;
                      snapMetas = metas;
                  } catch (Throwable t) {
                      snapIds = null;
                      snapLevel = null;
                  }
              }

              private void restoreBlocks() {
                  if (snapIds == null || snapLevel == null) {
                      return;
                  }
                  try {
                      for (int xi = 0; xi < nx; xi++) {
                          for (int zi = 0; zi < nx; zi++) {
                              for (int yi = 0; yi < ny; yi++) {
                                  int idx = (xi * nx + zi) * ny + yi;
                                  Vector3 v = new Vector3(sx + xi, sy + yi, sz + zi);
                                  Block cur = snapLevel.getBlock(v);
                                  if (cur.getId() != snapIds[idx] || Util.meta(cur) != snapMetas[idx]) {
                                      Block orig = Util.block(snapIds[idx], snapMetas[idx]);
                                      if (orig != null) {
                                          snapLevel.setBlock(v, orig, true, false);
                                      }
                                  }
                              }
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  snapIds = null;
                  snapMetas = null;
                  placed.clear();
              }
          }
