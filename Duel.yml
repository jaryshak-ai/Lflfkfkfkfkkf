                          case 1:
                              openMapList(pl);
                              break;
                          case 2:
                              openActive(pl);
                              break;
                          case 3:
                              plugin.reloadAll();
                              info(pl, "Админ: дуэли", "Конфиг и карты перезагружены.", () -> openAdmin(pl));
