          package ru.eclips.duel;

          import cn.nukkit.utils.Config;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;

          /** Настройки из config.yml. */
          public final class Settings {
              public int lobbyWait = 70;
              public int countdown = 12;
              public int matchTime = 600;
              public int maxTeam = 5;
              public int radius = 20;
              public int up = 15;
              public int down = 30;
              public int tpBackExcess = 10;
              public int buildHeight = 10;
              public int pwMin = 3;
              public int pwMax = 16;
              public int statsFlush = 30;
              public String redColor = "§c";
              public String blueColor = "§9";
              public String redName = "Красные";
              public String blueName = "Синие";
              public List<String> forbiddenBlocks = new ArrayList<>();
              public List<String> forbiddenItems = new ArrayList<>();
              public List<String> interactBlocks = new ArrayList<>();
              public List<String> allowedCommands = new ArrayList<>();

              private static int clamp(int v, int lo, int hi) {
                  return Math.max(lo, Math.min(hi, v));
              }

              private static List<String> list(Config c, String key, String... def) {
                  List<String> src;
                  try {
                      src = c.exists(key) ? c.getStringList(key) : Arrays.asList(def);
                  } catch (Throwable t) {
                      src = Arrays.asList(def);
                  }
                  List<String> out = new ArrayList<>();
                  for (String s : src) {
                      if (s != null && !s.trim().isEmpty()) {
                          out.add(s.trim().toLowerCase(Locale.ROOT));
                      }
                  }
                  return out;
              }

              public void load(Config c) {
                  lobbyWait = clamp(c.getInt("lobby-wait-seconds", 70), 10, 3600);
                  countdown = clamp(c.getInt("countdown-seconds", 12), 3, 60);
                  matchTime = clamp(c.getInt("match-time-seconds", 600), 30, 7200);
                  maxTeam = clamp(c.getInt("max-team-size", 5), 2, 5);
                  radius = clamp(c.getInt("border.radius", 20), 5, 200);
                  up = clamp(c.getInt("border.up", 15), 3, 200);
                  down = clamp(c.getInt("border.down", 30), 3, 200);
                  tpBackExcess = clamp(c.getInt("border.teleport-back-excess", 10), 2, 100);
                  buildHeight = clamp(c.getInt("build.max-height", 10), 1, 100);
                  pwMin = clamp(c.getInt("password.min-length", 3), 1, 32);
                  pwMax = clamp(c.getInt("password.max-length", 16), pwMin, 64);
                  statsFlush = clamp(c.getInt("stats-save-seconds", 30), 5, 600);
                  redColor = c.getString("teams.red-color", "§c");
                  blueColor = c.getString("teams.blue-color", "§9");
                  redName = c.getString("teams.red-name", "Красные");
                  blueName = c.getString("teams.blue-name", "Синие");
                  forbiddenBlocks = list(c, "build.forbidden-blocks", "tnt", "lava", "fire", "sand", "gravel", "powder", "anvil", "dragon egg");
                  forbiddenItems = list(c, "forbidden-items", "flint", "fire charge", "tnt", "lava");
                  interactBlocks = list(c, "blocked-interact-blocks", "chest", "furnace", "barrel", "hopper", "dropper", "dispenser",
                          "shulker", "anvil", "enchant", "brewing", "beacon", "smoker", "blast", "loom", "grindstone");
                  allowedCommands = list(c, "allowed-commands", "duel");
              }
          }
