              private void openMapCreate(Player p) {
                  FormWindowCustom f = new FormWindowCustom("Новая карта");
                  f.addElement(new ElementInput("Название карты (буквы, цифры, _ и -)", "например arena1", ""));
                  open(p, f, (pl, r, closed) -> {
                      if (closed) {
                          return;
                      }
                      Object o = answers(r).get(0);
                      String name = o == null ? "" : String.valueOf(o).trim();
                      if (!name.matches("[\\p{L}0-9_\\-]{2,24}") || !name.matches(".*\\p{L}.*")) {
                          info(pl, "Новая карта", "Название: 2-24 символа, буквы, цифры, _ и -, хотя бы одна буква.", () -> openMapCreate(pl));
                          return;
                      }
                      if (plugin.maps.get(name) != null) {
                          info(pl, "Новая карта", "Карта с таким названием уже есть.", () -> openMapCreate(pl));
                          return;
                      }
                      DuelMap m = new DuelMap(name);
                      m.enabled = false;
                      plugin.maps.add(m);
                      openMapEditor(pl, m, "Карта создана. Задай общую точку, спавны и сет, затем включи карту.");
                  });
              }

              private void openMapList(Player p) {
                  List<DuelMap> list = plugin.maps.all();
                  if (list.isEmpty()) {
                      info(p, "Карты", "Карт пока нет.", () -> openAdmin(p));
                      return;
                  }
                  FormWindowSimple f = new FormWindowSimple("Карты", "Выбери карту:");
                  for (DuelMap m : list) {
                      String st = plugin.manager.isBusy(m.name) ? "занята"
                              : (m.isReady(plugin.settings) ? "готова" : (m.enabled ? "не готова" : "выключена"));
                      f.addButton(button2(m.name, st));
                  }
                  f.addButton(button("Назад"));
                  open(p, f, (pl, r, closed) -> {
                      if (closed) {
                          return;
                      }
                      int i = clicked(r);
                      if (i < 0 || i >= list.size()) {
                          openAdmin(pl);
                          return;
                      }
                      openMapEditor(pl, list.get(i), null);
                  });
              }

              private String yn(boolean b) {
                  return b ? "задана" : "нет";
              }

              public void openMapEditor(Player p, DuelMap m, String note) {
                  Settings s = plugin.settings;
                  boolean busy = plugin.manager.isBusy(m.name);
                  String prob = m.problem(s);
                  StringBuilder sb = new StringBuilder();
                  if (note != null) {
                      sb.append(note).append("\n\n");
                  }
                  sb.append("Мир: ").append(m.lobby == null ? "не задан" : m.lobby.level).append("\n");
                  sb.append("Общая точка (лобби): ").append(yn(m.lobby != null)).append("\n");
                  sb.append("Спавн красных: ").append(yn(m.red != null)).append("\n");
                  sb.append("Спавн синих: ").append(yn(m.blue != null)).append("\n");
                  sb.append("Сет: ").append(m.hasKit() ? m.kitItems() + " предм., брони " + m.kitArmor() + "/4" : "не задан").append("\n");
                  sb.append("Граница: ").append(s.radius).append(" блоков в стороны, ").append(s.up).append(" вверх, ").append(s.down)
                          .append(" вниз от общей точки\n");
                  sb.append("Статус: ").append(busy ? "занята дуэлью" : (m.enabled ? "включена" : "выключена")).append("\n");
                  if (prob != null) {
                      sb.append("Не хватает: ").append(prob);
                  } else {
                      sb.append("Карта готова к играм.");
                  }
                  FormWindowSimple f = new FormWindowSimple("Карта: " + m.name, sb.toString());
                  f.addButton(button("Общая точка (лобби) здесь"));
                  f.addButton(button("Спавн красных здесь"));
                  f.addButton(button("Спавн синих здесь"));
                  f.addButton(button("Сет из моего инвентаря"));
                  f.addButton(button(m.enabled ? "Выключить карту" : "Включить карту"));
                  f.addButton(button("Удалить карту"));
                  f.addButton(button("Назад"));
                  open(p, f, (pl, r, closed) -> {
                      if (closed) {
                          return;
                      }
                      int i = clicked(r);
                      if (i < 0 || i > 5) {
                          openMapList(pl);
                          return;
                      }
                      if (plugin.manager.isBusy(m.name)) {
                          info(pl, "Карта: " + m.name, "На карте идёт дуэль, изменения сейчас недоступны.", () -> openMapEditor(pl, m, null));
                          return;
                      }
                      switch (i) {
                          case 0:
                              m.lobby = DuelMap.Pt.of(pl);
                              plugin.maps.save(m);
                              openMapEditor(pl, m, "Общая точка задана. Граница дуэли: " + s.radius + " блоков в стороны, " + s.up
                                      + " вверх, " + s.down + " вниз от неё.");
                              break;
                          case 1:
                          case 2:
                              setSpawn(pl, m, i == 1);
                              break;
                          case 3:
                              int n = m.setKitFrom(pl);
                              if (n == 0) {
                                  openMapEditor(pl, m, "Инвентарь пуст, сет не сохранён.");
                              } else {
                                  plugin.maps.save(m);
                                  openMapEditor(pl, m, "Сет сохранён: положение вещей, броня и вторая рука записаны как в твоём инвентаре.");
                              }
                              break;
                          case 4:
                              if (!m.enabled && m.problem(s) != null) {
                                  openMapEditor(pl, m, "Нельзя включить: " + m.problem(s) + ".");
                              } else {
                                  m.enabled = !m.enabled;
                                  plugin.maps.save(m);
                                  openMapEditor(pl, m, m.enabled ? "Карта включена." : "Карта выключена.");
                              }
                              break;
                          case 5:
                              confirm(pl, "Удалить карту", "Удалить карту " + m.name + " вместе с сетом?", () -> {
                                  plugin.maps.remove(m.name);
                                  openMapList(pl);
                              }, () -> openMapEditor(pl, m, null));
                              break;
                          default:
                              break;
                      }
                  });
              }

              private void setSpawn(Player p, DuelMap m, boolean red) {
                  Settings s = plugin.settings;
                  if (m.lobby == null) {
                      openMapEditor(p, m, "Сначала задай общую точку (лобби).");
                      return;
                  }
                  DuelMap.Pt pt = DuelMap.Pt.of(p);
                  if (!pt.level.equals(m.lobby.level)) {
                      openMapEditor(p, m, "Спавн должен быть в том же мире, что и общая точка.");
                      return;
                  }
                  if (m.excess(s, pt.x, pt.y, pt.z) > 0) {
                      openMapEditor(p, m, "Эта точка вне границы дуэли (" + s.radius + " в стороны, " + s.up + " вверх, " + s.down
                              + " вниз от общей точки).");
                      return;
                  }
                  if (red) {
                      m.red = pt;
                  } else {
                      m.blue = pt;
                  }
                  plugin.maps.save(m);
                  openMapEditor(p, m, red ? "Спавн красных задан." : "Спавн синих задан.");
              }

              private void openActive(Player p) {
                  List<Match> list = plugin.manager.all();
                  if (list.isEmpty()) {
                      info(p, "Активные дуэли", "Сейчас нет активных дуэлей.", () -> openAdmin(p));
                      return;
                  }
                  FormWindowSimple f = new FormWindowSimple("Активные дуэли", "Выбери дуэль, чтобы завершить её принудительно:");
                  for (Match m : list) {
                      f.addButton(button2(m.map.name + "  " + m.size + "x" + m.size, "Создал: " + m.creator + "  Игроков: " + m.count()));
                  }
                  f.addButton(button("Назад"));
                  open(p, f, (pl, r, closed) -> {
                      if (closed) {
                          return;
                      }
                      int i = clicked(r);
                      if (i < 0 || i >= list.size()) {
                          openAdmin(pl);
                          return;
                      }
                      Match m = list.get(i);
                      confirm(pl, "Завершить дуэль", "Завершить дуэль на карте " + m.map.name + "? Все игроки получат вещи обратно.", () -> {
                          m.finish(null, "Дуэль завершена администратором.");
                          openActive(pl);
                      }, () -> openActive(pl));
                  });
              }
          }
