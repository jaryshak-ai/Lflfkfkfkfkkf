              // ---- статистика ----

              private void openStats(Player p) {
                  StatsStore.Row r = plugin.stats.get(p.getUniqueId());
                  int games = r.wins + r.losses;
                  String rate = games == 0 ? "0%" : Math.round(r.wins * 100.0 / games) + "%";
                  String body = "Победы: " + r.wins + "\nПоражения: " + r.losses + "\nПроцент побед: " + rate + "\nУбийства: " + r.kills
