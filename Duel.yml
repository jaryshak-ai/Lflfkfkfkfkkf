          package ru.eclips.duel;

          import java.lang.reflect.Method;
          import java.util.concurrent.ConcurrentHashMap;

          /**
           * Безопасные вызовы через рефлексию. Если метода нет в ядре или он упал,
           * плагин не ломается: вызов просто возвращает null / false.
           */
          public final class Refl {
              private static final ConcurrentHashMap<String, Method> CACHE = new ConcurrentHashMap<>();

              private Refl() {
              }

              public static Object call(Object target, String name, Object... args) {
                  if (target == null) {
                      return null;
                  }
                  try {
                      Method m = find(target.getClass(), name, args);
                      if (m == null) {
                          return null;
                      }
                      return m.invoke(target, args);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              /** true, если метод найден и вызван без ошибок. */
              public static boolean run(Object target, String name, Object... args) {
                  if (target == null) {
                      return false;
                  }
                  try {
                      Method m = find(target.getClass(), name, args);
                      if (m == null) {
                          return false;
                      }
                      m.invoke(target, args);
                      return true;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              public static Object callStatic(String className, String name, Object... args) {
                  try {
                      Class<?> c = Class.forName(className);
                      Method m = find(c, name, args);
                      if (m == null) {
                          return null;
                      }
                      return m.invoke(null, args);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              public static Object enumValue(String className, String constant) {
                  try {
                      Class<?> c = Class.forName(className);
                      Object[] all = c.getEnumConstants();
                      if (all == null) {
                          return null;
                      }
                      for (Object o : all) {
                          if (((Enum<?>) o).name().equals(constant)) {
                              return o;
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              private static Method find(Class<?> c, String name, Object[] args) {
                  StringBuilder k = new StringBuilder(c.getName()).append('#').append(name);
                  for (Object a : args) {
                      k.append('#').append(a == null ? "null" : a.getClass().getName());
                  }
                  String key = k.toString();
                  Method cached = CACHE.get(key);
                  if (cached != null) {
                      return cached;
                  }
                  for (Method m : c.getMethods()) {
                      if (!m.getName().equals(name) || m.getParameterCount() != args.length) {
                          continue;
                      }
                      Class<?>[] pt = m.getParameterTypes();
                      boolean ok = true;
                      for (int i = 0; i < pt.length && ok; i++) {
                          if (args[i] == null) {
                              ok = !pt[i].isPrimitive();
                          } else {
                              ok = wrap(pt[i]).isInstance(args[i]);
                          }
                      }
                      if (ok) {
                          try {
                              m.setAccessible(true);
                          } catch (Throwable ignored) {
                          }
                          CACHE.put(key, m);
                          return m;
                      }
                  }
                  return null;
              }

              private static Class<?> wrap(Class<?> c) {
                  if (!c.isPrimitive()) {
                      return c;
                  }
                  if (c == int.class) {
                      return Integer.class;
                  }
                  if (c == boolean.class) {
                      return Boolean.class;
                  }
                  if (c == float.class) {
                      return Float.class;
                  }
                  if (c == double.class) {
                      return Double.class;
                  }
                  if (c == long.class) {
                      return Long.class;
                  }
                  if (c == short.class) {
                      return Short.class;
                  }
                  if (c == byte.class) {
                      return Byte.class;
                  }
                  if (c == char.class) {
                      return Character.class;
                  }
                  return c;
              }
          }
