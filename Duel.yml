          package ru.eclips.duel;

          import cn.nukkit.Player;
          import cn.nukkit.inventory.PlayerInventory;
          import cn.nukkit.item.Item;
          import cn.nukkit.level.Location;

          import java.util.LinkedHashMap;
          import java.util.Map;

          /** Карта дуэли: общая точка (лобби), спавны команд, сет, граница. */
          public final class DuelMap {
              /** Точка в мире. */
              public static final class Pt {
                  public final String level;
                  public final double x;
                  public final double y;
                  public final double z;
                  public final double yaw;
                  public final double pitch;

                  public Pt(String level, double x, double y, double z, double yaw, double pitch) {
                      this.level = level;
                      this.x = x;
                      this.y = y;
                      this.z = z;
                      this.yaw = yaw;
                      this.pitch = pitch;
                  }

                  public static Pt of(Player p) {
                      Location l = p.getLocation();
                      return new Pt(p.getLevel().getFolderName(), l.getX(), l.getY(), l.getZ(), l.getYaw(), l.getPitch());
                  }

                  public String serialize() {
                      return level + "|" + x + "|" + y + "|" + z + "|" + yaw + "|" + pitch;
                  }

                  public static Pt parse(String s) {
                      if (s == null || s.isEmpty()) {
                          return null;
                      }
                      try {
                          String[] a = s.split("\\|");
                          return new Pt(a[0], Double.parseDouble(a[1]), Double.parseDouble(a[2]), Double.parseDouble(a[3]),
                                  Double.parseDouble(a[4]), Double.parseDouble(a[5]));
                      } catch (Throwable t) {
                          return null;
                      }
                  }
              }

              public final String name;
              public boolean enabled = true;
              public Pt lobby;
              public Pt red;
              public Pt blue;
              /** Ключи: i0..i35 (слоты), a0..a3 (шлем, нагрудник, поножи, ботинки), o_hand (вторая рука). */
              public final Map<String, String> kit = new LinkedHashMap<>();

              public DuelMap(String name) {
                  this.name = name;
              }

              public boolean hasKit() {
                  return !kit.isEmpty();
              }

              public int kitItems() {
                  int n = 0;
                  for (String k : kit.keySet()) {
                      if (k.startsWith("i")) {
                          n++;
                      }
                  }
                  return n;
              }

              public int kitArmor() {
                  int n = 0;
                  for (String k : kit.keySet()) {
                      if (k.startsWith("a")) {
                          n++;
                      }
                  }
                  return n;
              }

              /** Насколько точка вышла за границу (0 = внутри). */
              public double excess(Settings s, double x, double y, double z) {
                  if (lobby == null) {
                      return 0;
                  }
                  double ex = Math.max(Math.abs(x - lobby.x), Math.abs(z - lobby.z)) - s.radius;
                  double ey = Math.max(y - lobby.y - s.up, lobby.y - s.down - y);
                  return Math.max(0, Math.max(ex, ey));
              }

              /** Можно ли поставить блок в этой клетке (до buildHeight блоков выше общей точки включительно). */
              public boolean canBuild(Settings s, int bx, int by, int bz) {
                  if (lobby == null) {
                      return false;
                  }
                  if (Math.abs(bx + 0.5 - lobby.x) > s.radius || Math.abs(bz + 0.5 - lobby.z) > s.radius) {
                      return false;
                  }
                  int baseY = (int) Math.floor(lobby.y);
                  return by <= baseY + s.buildHeight && by >= baseY - s.down;
              }

              /** Текст проблемы или null, если карта готова к играм. */
              public String problem(Settings s) {
                  if (lobby == null) {
                      return "не задана общая точка (лобби)";
                  }
                  if (red == null) {
                      return "не задан спавн красных";
                  }
                  if (blue == null) {
                      return "не задан спавн синих";
                  }
                  if (!lobby.level.equals(red.level) || !lobby.level.equals(blue.level)) {
                      return "точки находятся в разных мирах";
                  }
                  if (excess(s, red.x, red.y, red.z) > 0) {
                      return "спавн красных вне границы";
                  }
                  if (excess(s, blue.x, blue.y, blue.z) > 0) {
                      return "спавн синих вне границы";
                  }
                  if (!hasKit()) {
                      return "не задан сет";
                  }
                  return null;
              }

              public boolean isReady(Settings s) {
                  return enabled && problem(s) == null;
              }

              /** Сет = текущий инвентарь админа: положение вещей сохраняется точно. */
              public int setKitFrom(Player p) {
                  Map<String, String> n = new LinkedHashMap<>();
                  PlayerInventory inv = p.getInventory();
                  int size = inv.getSize();
                  for (int i = 0; i < size; i++) {
                      String e = ItemCodec.encode(inv.getItem(i));
                      if (!e.isEmpty()) {
                          n.put("i" + i, e);
                      }
                  }
                  String[] a = {
                          ItemCodec.encode(inv.getHelmet()), ItemCodec.encode(inv.getChestplate()),
                          ItemCodec.encode(inv.getLeggings()), ItemCodec.encode(inv.getBoots())
                  };
                  for (int i = 0; i < 4; i++) {
                      if (!a[i].isEmpty()) {
                          n.put("a" + i, a[i]);
                      }
                  }
                  String off = ItemCodec.encode(Util.getOffhand(p));
                  if (!off.isEmpty()) {
                      n.put("o_hand", off);
                  }
                  kit.clear();
                  kit.putAll(n);
                  return n.size();
              }

              public void giveKit(Player p) {
                  PlayerInventory inv = p.getInventory();
                  try {
                      inv.clearAll();
                  } catch (Throwable ignored) {
                  }
                  Util.setOffhand(p, null);
                  for (Map.Entry<String, String> e : kit.entrySet()) {
                      try {
                          String k = e.getKey();
                          Item it = ItemCodec.decode(e.getValue());
                          if (it == null) {
                              continue;
                          }
                          if (k.equals("a0")) {
                              inv.setHelmet(it);
                          } else if (k.equals("a1")) {
                              inv.setChestplate(it);
                          } else if (k.equals("a2")) {
                              inv.setLeggings(it);
                          } else if (k.equals("a3")) {
                              inv.setBoots(it);
                          } else if (k.equals("o_hand")) {
                              Util.setOffhand(p, it);
                          } else if (k.startsWith("i")) {
                              inv.setItem(Integer.parseInt(k.substring(1)), it);
                          }
                      } catch (Throwable ignored) {
                      }
                  }
                  try {
                      inv.sendContents(p);
                      inv.sendArmorContents(p);
                  } catch (Throwable ignored) {
                  }
              }
          }
